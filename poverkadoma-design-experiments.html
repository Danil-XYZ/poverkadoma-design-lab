/* Local accessibility adjustments for v3. Append after the remapped v2 CSS.
   Deliberately preserves page/card geometry, palette, title sizes and primary buttons.
   CSS px here describe the HTML prototype; Android targets must use dp/sp.
   Required fields, validation messages, focus transfer and 200% testing need app logic. */

/* Operational metadata must not shrink again inside a smaller parent. */
[data-pd-app] .job-number,
[data-pd-app] .status-label,
[data-pd-app] .list-caption,
[data-pd-app] .hub-row small,
[data-pd-app] .nepton-entry small,

[data-pd-app] .meter-row-title > span,

[data-pd-app] .form-v2 .bottom-actions .row,
[data-pd-app] .profile-passport small,
[data-pd-app] .profile-passport p,
[data-pd-app] .client-name small,
[data-pd-app] .client-sheet > .helper,
[data-pd-app] .sync-line,
[data-pd-app] .recognition-note,
[data-pd-app] .readiness-detail summary > span:last-child,
[data-pd-app] .field .helper {
  font-size: calc(var(--pd-size) * .88);
  line-height: 1.45;
}

[data-pd-app] .step-nav button,
[data-pd-app] .segmented button,
[data-pd-app] .date-button,
[data-pd-app] .readiness-check,

[data-pd-app] .bid-details summary,
[data-pd-app] .compact-save,
[data-pd-app] .form-v2 .bottom-actions > .text-button {
  font-size: calc(var(--pd-size) * .88);
  line-height: 1.45;
}

[data-pd-app] .header-tool > span:last-child,
[data-pd-app] .filter-tool,
[data-pd-app] .icon-link {
  font-size: calc(var(--pd-size) * .84);
  line-height: 1.4;
}

/* Keep the same label ratio in normal and large text modes. */
[data-pd-app] .app-nav button,
[data-pd-app] .large-text .app-nav button {
  font-size: calc(var(--pd-size) * .84);
  line-height: 1.35;
  overflow-wrap: normal;

[data-pd-app] .header-icon {
  min-width: 48px;
  min-height: 48px;
}
[data-pd-app] .segmented button,
[data-pd-app] .date-button,
[data-pd-app] .icon-link,
[data-pd-app] .filter-tool,

  min-height: 48px;
}
[data-pd-app] .date-button {
  padding-inline: 6px;
}

/* Explicit, nonverbal disclosure shape; native details semantics remain intact. */
[data-pd-app] summary.task-row::after {
  content: "";
  display: block;
  width: 8px;
  height: 8px;
  margin-inline: 4px;

/* The current green foreground / green tint is 4.303:1 in light mode.

/* Three structural experiments. All product colors have light/dark pairs. */
[data-pd-app][data-design="workshop"] {
  --x-font: "Golos Text", "Segoe UI", Arial, sans-serif;
  --x-heading-font: "Roboto Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --x-radius: 4px;
  --pd-ink: light-dark(#172333,#eef1ff);
  --pd-subtle: light-dark(#4c5e72,#b9c7df);
  --pd-paper: light-dark(#ffffff,#182b48);
  --pd-bg: light-dark(#e7edf7,#0d1830);
  --pd-line: light-dark(#adbace,#50627f);
  --pd-blue: light-dark(#2144ad,#b6c7ff);
  --pd-on-blue: light-dark(#ffffff,#15295f);
  --pd-tint: light-dark(#e3eafe,#243d67);
  --pd-green: light-dark(#276342,#a4dbaf);
  --pd-on-green: light-dark(#ffffff,#10301d);
  --pd-green-bg: light-dark(#e4f1e7,#203d31);
  --pd-amber: light-dark(#805100,#f5d18b);
  --pd-amber-bg: light-dark(#fff0c9,#4d3c16);
  --pd-red: light-dark(#9f3438,#f9bcbe);
  --pd-red-bg: light-dark(#fbe6e7,#542e36);
  --pd-neutral-status: light-dark(#dce3ee,#35465e);
  --x-header: light-dark(#2144ad,#1c357d);
  --x-header-ink: light-dark(#ffffff,#ffffff);
  --x-band: light-dark(#f2c86b,#dab158);
  --x-band-ink: light-dark(#312303,#241902);
  --pd-header: var(--x-header);
  --pd-header-ink: var(--x-header-ink);
  font-family: var(--x-font);
}
[data-pd-app][data-design="address"] {
  --x-font: "PT Sans", "Segoe UI", Arial, sans-serif;
  --x-heading-font: "PT Serif", Georgia, "Times New Roman", serif;
  --x-radius: 14px;
  --pd-ink: light-dark(#182e28,#ecf2eb);
  --pd-subtle: light-dark(#52625a,#baccbf);
  --pd-paper: light-dark(#fffdfc,#18382d);
  --pd-bg: light-dark(#eeefea,#0c211a);
  --pd-line: light-dark(#b5c2b8,#4f7562);
  --pd-blue: light-dark(#155c44,#9bdab8);
  --pd-on-blue: light-dark(#ffffff,#123a2a);
  --pd-tint: light-dark(#dfece3,#264c3b);
  --pd-green: light-dark(#155c44,#9bdab8);
  --pd-on-green: light-dark(#ffffff,#123a2a);
  --pd-green-bg: light-dark(#dfece3,#264c3b);
  --pd-amber: light-dark(#795620,#e6c27e);
  --pd-amber-bg: light-dark(#f5ead1,#48391f);
  --pd-red: light-dark(#9e3c35,#f7b9ad);
  --pd-red-bg: light-dark(#fbe7e0,#57332b);
  --pd-neutral-status: light-dark(#e1e5df,#344b40);
  --x-header: light-dark(#fffdfc,#18382d);
  --x-header-ink: light-dark(#182e28,#ecf2eb);
  --pd-header: var(--x-header);
  --pd-header-ink: var(--x-header-ink);
  font-family: var(--x-font);
}
[data-pd-app][data-design="folders"] {
  --x-font: "Golos Text", "Segoe UI", Arial, sans-serif;
  --x-heading-font: "PT Sans", "Segoe UI", Arial, sans-serif;
  --x-radius: 5px;
  --pd-ink: light-dark(#26272c,#f4eeea);
  --pd-subtle: light-dark(#616169,#c8c0be);
  --pd-paper: light-dark(#fffefc,#302a2c);
  --pd-bg: light-dark(#ece9e6,#191618);
  --pd-line: light-dark(#c1b6b2,#6d5c5f);
  --pd-blue: light-dark(#a53231,#ffb6b0);
  --pd-on-blue: light-dark(#ffffff,#541d1b);
  --pd-tint: light-dark(#f5e1dd,#533238);
  --pd-green: light-dark(#326048,#b8dcb9);
  --pd-on-green: light-dark(#ffffff,#223a29);
  --pd-green-bg: light-dark(#e3eee4,#2d4537);
  --pd-amber: light-dark(#77510b,#edcf91);
  --pd-amber-bg: light-dark(#f6ebcf,#4e3f23);
  --pd-red: light-dark(#a53231,#ffb6b0);
  --pd-red-bg: light-dark(#f5e1dd,#533238);
  --pd-neutral-status: light-dark(#e3dedb,#4d4144);
  --x-header: light-dark(#2c2e35,#262228);
  --x-header-ink: light-dark(#fff8f1,#fff8f1);
  --pd-header: var(--x-header);
  --pd-header-ink: var(--x-header-ink);

/* Shared mechanics, with an explicit scope for every selector. */
[data-pd-app][data-design="workshop"] .x-utilities,
[data-pd-app][data-design="address"] .x-utilities,
[data-pd-app][data-design="folders"] .x-utilities {display:flex;gap:6px;flex-wrap:wrap;min-width:0}
[data-pd-app][data-design="workshop"] .x-utility,
[data-pd-app][data-design="address"] .x-utility,
[data-pd-app][data-design="folders"] .x-utility {font:inherit;font-size:calc(var(--pd-size)*.88);line-height:1.4;color:inherit;background:transparent;border:0;min-height:48px;padding:8px 5px;min-width:0}
[data-pd-app][data-design="workshop"] .x-local,
[data-pd-app][data-design="address"] .x-local,
[data-pd-app][data-design="folders"] .x-local {display:block;color:var(--pd-amber);font-size:calc(var(--pd-size)*.88);line-height:1.5;margin-top:10px}
[data-pd-app][data-design="workshop"] .x-menu-link,
[data-pd-app][data-design="address"] .x-menu-link {display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px;border:0;border-bottom:1px solid var(--pd-line);border-radius:0;background:var(--pd-paper);color:var(--pd-ink);font:inherit;text-align:left;line-height:1.4}
[data-pd-app][data-design="workshop"] .x-menu-link[aria-current],
[data-pd-app][data-design="address"] .x-menu-link[aria-current] {background:var(--pd-tint);color:var(--pd-blue);font-weight:600}
[data-pd-app][data-design="workshop"] .x-drawer,
[data-pd-app][data-design="address"] .x-drawer,
[data-pd-app][data-design="folders"] .x-drawer {position:absolute;bottom:calc(100% + 6px);left:8px;right:8px;z-index:8;max-height:55vh;overflow:auto;padding:10px;background:var(--pd-paper);color:var(--pd-ink);border:1px solid var(--pd-subtle);border-radius:var(--x-radius)}
[data-pd-app][data-design="workshop"] .app-nav,
[data-pd-app][data-design="address"] .app-nav,
[data-pd-app][data-design="folders"] .app-nav {position:relative;z-index:5;box-shadow:none}
[data-pd-app][data-design="workshop"] .xw-menu,
[data-pd-app][data-design="address"] .xa-menu,
[data-pd-app][data-design="folders"] .xf-catalog {margin:0;min-width:0}
[data-pd-app][data-design="workshop"] .xw-menu>summary,
[data-pd-app][data-design="address"] .xa-menu>summary,
[data-pd-app][data-design="folders"] .xf-catalog>summary {display:flex;align-items:center;justify-content:center;gap:9px;min-height:56px;padding:10px 8px;list-style:none;margin:0;line-height:1.35;font-size:1em;color:inherit}
[data-pd-app][data-design="workshop"] .xw-menu>summary::-webkit-details-marker,
[data-pd-app][data-design="address"] .xa-menu>summary::-webkit-details-marker,
[data-pd-app][data-design="folders"] .xf-catalog>summary::-webkit-details-marker {display:none}
[data-pd-app][data-design="workshop"] .xw-menu>summary span,
[data-pd-app][data-design="address"] .xa-menu>summary span,
[data-pd-app][data-design="folders"] .xf-catalog>summary span {min-width:0;overflow-wrap:anywhere}
[data-pd-app][data-design="workshop"] .xw-menu[open]>summary,
[data-pd-app][data-design="address"] .xa-menu[open]>summary,
[data-pd-app][data-design="folders"] .xf-catalog[open]>summary {text-decoration:underline;text-underline-offset:5px}
[data-pd-app][data-design="workshop"] .max-text .x-utilities,
[data-pd-app][data-design="address"] .max-text .x-utilities,
[data-pd-app][data-design="folders"] .max-text .x-utilities {flex:1 0 100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
[data-pd-app][data-design="workshop"] .max-text .x-utility,
[data-pd-app][data-design="address"] .max-text .x-utility,
[data-pd-app][data-design="folders"] .max-text .x-utility {overflow-wrap:anywhere}

/* Workshop: a heavy tool header and one ochre work-stage strip. */
[data-pd-app][data-design="workshop"] .xw-header {display:flex;flex-wrap:wrap;gap:6px 12px;background:var(--x-header);color:var(--x-header-ink);padding:12px 18px 19px}
[data-pd-app][data-design="workshop"] .xw-brand {flex:1;min-width:0;font-size:calc(var(--pd-size)*.88);line-height:1.4}
[data-pd-app][data-design="workshop"] .xw-header .header-title {flex:1 0 100%;font-family:var(--x-heading-font);font-size:1.9em;font-weight:600;letter-spacing:-.025em;line-height:1.12;margin:0}
[data-pd-app][data-design="workshop"] .xw-main {background:var(--pd-bg)}
[data-pd-app][data-design="workshop"] .xw-controls {padding:18px 18px 4px}

[data-pd-app][data-design="workshop"] .xw-group-title span {font-variant-numeric:tabular-nums}

[data-pd-app][data-design="workshop"] .xw-job-top {display:flex;align-items:start;justify-content:space-between;flex-wrap:wrap;gap:8px}

[data-pd-app][data-design="workshop"] .xw-address {display:block;font-family:var(--x-heading-font);font-size:1.27em;font-weight:600;line-height:1.35;margin:12px 0;overflow-wrap:anywhere}
[data-pd-app][data-design="workshop"] .xw-job-meta {display:flex;gap:6px 14px;flex-wrap:wrap;font-size:calc(var(--pd-size)*.88);color:var(--pd-subtle);line-height:1.5}
[data-pd-app][data-design="workshop"] .xw-open {display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding-top:10px;border-top:1px solid var(--pd-line);font-size:1em;line-height:1.4;color:var(--pd-blue)}
[data-pd-app][data-design="workshop"] .xw-nav {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row;gap:1px;background:var(--x-header);color:var(--x-header-ink);padding:4px 6px 8px}
[data-pd-app][data-design="workshop"] .xw-menu+ .xw-menu {border-left:1px solid var(--x-header-ink)}
[data-pd-app][data-design="workshop"] .xw-act-groups .xw-task-group {padding:0}
[data-pd-app][data-design="workshop"] .xw-act-groups .job-card {border:0;border-bottom:2px solid var(--pd-bg);border-radius:0;box-shadow:none;margin:0;padding:17px 14px}
[data-pd-app][data-design="workshop"] .sheet,
[data-pd-app][data-design="workshop"] .form-group {border-radius:4px;box-shadow:none}
[data-pd-app][data-design="workshop"] .bid-primary {padding-top:17px;padding-bottom:17px;background:var(--pd-paper);margin:0 18px 18px}
[data-pd-app][data-design="workshop"] .job-address,
[data-pd-app][data-design="workshop"] .screen-title {font-family:var(--x-heading-font)}
[data-pd-app][data-design="workshop"] .primary,
[data-pd-app][data-design="workshop"] .secondary,
[data-pd-app][data-design="workshop"] .create-button {border-radius:4px}
[data-pd-app][data-design="workshop"] .max-text .xw-brand {display:none}

/* Address book: street headings, house numbers and real work objects. */
[data-pd-app][data-design="address"] .xa-header {display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 18px 17px;background:var(--pd-paper);color:var(--pd-ink);border-bottom:3px solid var(--pd-blue)}
[data-pd-app][data-design="address"] .xa-brand {flex:1;min-width:0;font-size:calc(var(--pd-size)*.88);color:var(--pd-blue)}
[data-pd-app][data-design="address"] .xa-header .header-title {flex:1 0 100%;font-family:var(--x-heading-font);font-size:1.65em;line-height:1.2;letter-spacing:-.025em;font-weight:600;margin:0}
[data-pd-app][data-design="address"] .xa-addressbook {padding:0 18px 22px}
[data-pd-app][data-design="address"] .xa-controls {padding-top:18px}
[data-pd-app][data-design="address"] .xa-street {margin:22px 0 0}
[data-pd-app][data-design="address"] .xa-street-title {display:flex;align-items:start;gap:9px;font-family:var(--x-heading-font);font-size:1.22em;font-weight:600;line-height:1.35;color:var(--pd-blue);margin:0 0 12px;overflow-wrap:anywhere}

[data-pd-app][data-design="address"] .xa-work {display:block;width:100%;padding:16px;border:0;border-bottom:1px solid var(--pd-line);background:var(--pd-paper);color:var(--pd-ink);font:inherit;text-align:left;min-height:48px}

[data-pd-app][data-design="address"] .xa-current-address {flex:1 0 100%;min-width:0;min-height:48px;text-align:left;font:inherit;font-size:calc(var(--pd-size)*.9);line-height:1.45;border:0;border-radius:6px;padding:10px;background:var(--pd-tint);color:var(--pd-blue);overflow-wrap:anywhere}

[data-pd-app][data-design="address"] .hub-list {box-shadow:none}

  const panel = (title, body, helper = '') => `<section class="section stack"><h2>${esc(title)}</h2>${helper ? `<p class="helper">${esc(helper)}</p>` : ''}${body}</section>`;

  const steps = (ctx, current) => Number(stateOf(ctx).fontScale) >= 1.6
    ? `<label class="field step-select"><span>Шаг заполнения</span><select data-action="meter-step-select">${[['data', '1. Данные'], ['measure', '2. Замеры'], ['result', '3. Итог']].map(([id, label]) => `<option value="${id}"${id === current ? ' selected' : ''}>${label}</option>`).join('')}</select></label>`
    : `<nav class="step-nav" aria-label="Этапы заполнения счётчика">${[['data', 'Данные'], ['measure', 'Замеры'], ['result', 'Итог']].map(([id, label], index) => `<button type="button" class="text-button" ${action('meter-step', id)}${id === current ? ' aria-current="step"' : ''}><span aria-hidden="true">${index + 1}</span>${esc(label)}</button>`).join('')}</nav>`;
  const disclosure = (title, status, body, options = {}) => `<details class="${options.className || 'form-group'}"${options.open ? ' open' : ''}><summary class="task-row"><span>${esc(title)}</span>${status ? `<span class="${options.tone || 'muted'}">${esc(status)}</span>` : ''}</summary><div class="stack">${body}</div></details>`;
  const photo = (ctx, label, id, help = '', fallback = false) => {
    const added = hasPhoto(ctx, id, fallback);
    const error = errorFor(ctx, id);
    return `<div class="photo-row photo-single"><button type="button" class="list-row task-row" ${action(added ? 'photo-view' : 'photo-capture', id)}${error ? ` aria-invalid="true" aria-describedby="error-${esc(id)}"` : ''}>${icon(ctx, added ? 'image' : 'camera')}<span><b>${esc(label)}</b><small class="${added ? 'success' : ''}">${added ? 'Открыть фото' : 'Добавить фото'}</small></span>${icon(ctx, 'chevron-right')}</button>${error ? `<p id="error-${esc(id)}" class="field-error danger">${esc(error)}</p>` : ''}</div>`;
  };
  const defaultMeters = [
    { id: 'cold-1', name: 'Холодная вода', model: 'БЕТАР СХВ-15', serial: '28476193', ready: true, result: 'Пригоден' },
    { id: 'hot-1', name: 'Горячая вода', model: 'БЕТАР СГВ-15', serial: '28476204', ready: false, result: '', missing: 'Нужно фото после пролива' }
  ];

  function act(ctx) {
    const a = slice(ctx, 'act');
    const meters = Array.isArray(a.meters) ? a.meters : defaultMeters;
    const done = meters.filter((m) => m.ready).length;
    const photoAdded = hasPhoto(ctx, 'act.document');
    const ready = typeof a.ready === 'boolean' ? a.ready : meters.length > 0 && done === meters.length && (!internal(ctx) || photoAdded);
    const receipt = obj(a.receipt);
    const receiptPhoto = hasPhoto(ctx, 'act.receipt');
    const title = a.number || '247-26-01428';
    const bidLabel = a.bidLabel === '' ? 'Без заявки' : a.bidLabel || 'Заявка № 1842';
    const paymentText = receipt.paid ? 'Оплачено' : receipt.created ? 'Чек создан' : receiptPhoto ? 'Фото чека есть' : 'Добавить чек';

    return `<div class="form-screen form-v2 stack">
      <details class="sheet act-passport"${!a.address || a.openSection === 'address' || errorFor(ctx, 'act.address') || errorFor(ctx, 'act.owner') ? ' open' : ''}>
        <summary><strong>${esc(a.address || 'Адрес и владелец')}</strong><span class="passport-meta"><span>${esc(a.owner || 'Заполните данные заказчика')}</span><span>Изменить ${icon(ctx, 'chevron-down')}</span></span></summary>
        <div class="stack">${field(ctx, 'Адрес', 'act.address', a.address ?? 'Тольятти, ул. Лесная, д. 8, кв. 24', { autocomplete: 'street-address' })}${field(ctx, 'Владелец счётчиков', 'act.owner', a.owner ?? 'Иванова Анна Николаевна', { autocomplete: 'name' })}<div class="row wrap"><span>${esc(bidLabel)}</span>${button(ctx, 'Изменить заявку', 'act-link-bid', '', 'text-button')}</div></div>
      </details>

      <section class="sheet act-meters">
        <div class="row between"><h2>Счётчики · ${meters.length}</h2>${receipt.qrCreated ? button(ctx, 'Чек', 'receipt-open', '', 'text-button') : button(ctx, 'Добавить', 'meter-add', '', 'text-button', 'plus')}</div>
        ${meters.length ? meters.map((m) => `<button type="button" class="list-row task-row meter-task" data-nav="meter" data-id="${esc(m.id)}" aria-label="${esc(`${m.name}, № ${m.serial}, ${m.model}, ${m.ready ? m.result || 'Готово' : m.missing || 'Завершить измерения'}`)}">${icon(ctx, String(m.name || '').toLowerCase().includes('газ') ? 'gauge' : 'droplet')}<span><span class="meter-row-title"><b>${esc(m.name)}</b><span class="${m.ready ? 'success' : 'warning'}">${esc(m.ready ? m.result || 'Готово' : 'Дополнить')}</span></span><small>№ ${esc(m.serial)} · ${esc(!m.ready && m.missing ? m.missing : m.model)}</small></span>${icon(ctx, 'chevron-right')}</button>`).join('') : '<p class="helper">Добавьте первый счётчик.</p>'}
        ${receipt.qrCreated ? '<p class="helper">Для изменения количества счётчиков сначала удалите чек с QR-кодом.</p>' : ''}
      </section>

      <section class="sheet act-ready">
        <h2>Перед отправкой</h2>
        ${photoAdded || !internal(ctx) ? disclosure('Бланк акта', photoAdded ? 'Фото есть' : 'По желанию', photo(ctx, 'Фото бумажного акта', 'act.document'), { className: 'readiness-detail', tone: photoAdded ? 'success' : 'muted', open: a.openSection === 'document' || !!errorFor(ctx, 'act.document') }) : photo(ctx, 'Фото бумажного акта', 'act.document')}
        ${disclosure('Оплата', paymentText, `${receipt.created ? `<strong>${esc(receipt.amount || `${meters.length * 900} ₽`)}</strong>${receipt.label ? `<p class="helper">${esc(receipt.label)}</p>` : ''}${!receipt.paid ? '<p class="helper">Чек создан. Оплата ещё не подтверждена.</p>' : ''}${button(ctx, 'Открыть чек', 'receipt-open', '', 'secondary')}${button(ctx, 'Оплатить по QR-коду', 'receipt-qr', '', 'secondary', 'qr-code')}` : button(ctx, 'Создать чек', 'receipt-create', '', 'secondary', 'receipt')}${photo(ctx, 'Фото кассового чека', 'act.receipt')}`, { className: 'readiness-detail', tone: receipt.paid ? 'success' : 'muted', open: a.openSection === 'payment' || !!errorFor(ctx, 'act.receipt') })}
        ${!ready ? button(ctx, 'Проверить готовность', 'act-check', '', 'text-button readiness-check') : ''}
      </section>

      ${disclosure('Дата, номер, примечание', '', `${field(ctx, 'Дата поверки', 'act.date', a.date || '2026-10-23', { type: 'date' })}${field(ctx, 'Номер акта', 'act.number', title, { readonly: internal(ctx) })}${internal(ctx) ? button(ctx, 'Сканировать другой бланк', 'act-rescan', '', 'secondary', 'scan') : ''}${field(ctx, 'Примечание', 'act.note', a.note || '')}`, { className: 'section', open: ['date','number','note'].some((key) => errorFor(ctx, 'act.' + key)) })}
      ${disclosure('Другие действия', '', `${a.bidLabel === '' ? '' : button(ctx, 'Отвязать заявку', 'act-unlink-bid', '', 'text-button')}${internal(ctx) ? checkbox(ctx, 'Бланк испорчен', 'act.defective', !!a.defective, 'Для акта, не связанного с заявкой.') : ''}${button(ctx, 'Удалить акт', 'act-delete', '', 'text-button danger')}`, { className: 'section' })}
      <div class="bottom-actions act-bottom-actions"><small class="${a.dirty ? 'warning' : 'success'}">${a.dirty ? 'Есть изменения' : 'Сохранено на телефоне'}${ready ? ' · Готов к отправке' : ' · Черновик'}</small>${ready ? `${button(ctx, 'Перейти к отправке', 'act-check', '', 'primary', 'arrow-right')}${button(ctx, 'Сохранить и закрыть', 'act-save', '', 'text-button compact-save')}` : button(ctx, 'Сохранить и закрыть', 'act-save', '', 'primary', 'check')}</div>
    </div>`;
  }

  function conditions(ctx, when) {
    const m = slice(ctx, 'meter');
    const after = when === 'after';
    const gas = m.service === 'gas';
    const required = !gas && (after ? m.advanced !== false && m.result !== 'unsuitable' : m.advanced !== false || m.method !== 'standard');
    const key = (name) => `meter.${after ? `after${name[0].toUpperCase()}${name.slice(1)}` : name}`;
    const value = (name, fallback) => after ? m[`after${name[0].toUpperCase()}${name.slice(1)}`] ?? '' : m[name] ?? (m.isNew ? '' : fallback);
    const fields = [['Давление, кПа', 'pressure', '101.3', '84–106'], ['Воздух, °C', 'temperature', '22.0', '5–50'], ['Влажность, %', 'humidity', '48.0', '30–80']];
    if (!gas) fields.push(['Вода, °C', 'waterTemperature', '', '5–40']);
    const hasAll = fields.every(([, name, fallback]) => value(name, fallback) !== '');
    const errors = fields.some(([, name]) => errorFor(ctx, key(name)));
    return disclosure(after ? 'Условия после поверки' : 'Условия до поверки', hasAll ? 'Заполнены' : required ? 'Заполнить' : 'Необязательно', `<div class="field-pair">${fields.map(([label, name, fallback, placeholder]) => field(ctx, label, key(name), value(name, fallback), { inputmode: 'decimal', placeholder, required })).join('')}</div>`, { className: 'section', tone: hasAll ? 'success' : required ? 'warning' : 'muted', open: errors || required && !hasAll || m.openSection === (after ? 'afterConditions' : 'conditions') });
  }

  function meter(ctx) {
    const m = slice(ctx, 'meter');
    const gas = m.service === 'gas';
    const serviceName = gas ? 'Газ' : m.service === 'hot' ? 'Горячая вода' : 'Холодная вода';
    const methodPhoto = m.method !== 'standard' && !gas;
    const advanced = m.advanced !== false;
    const recognized = !m.isNew && m.recognized !== false && !m.recognitionConfirmed;
    const result = m.result || 'suitable';
    if (m.step === 'measure') return strains(ctx);
    if (m.step === 'result') return `<div class="form-screen form-v2 stack">
      ${steps(ctx, 'result')}${heading('Результат', `${serviceName} · № ${m.serial || '28476193'}`)}
      <section class="section"><div class="row result-choices" role="group" aria-label="Заключение по счётчику">${[['suitable', 'Пригоден'], ['unsuitable', 'Непригоден']].map(([id, label]) => `<button type="button" class="secondary ${result === id ? 'selected' : ''}" ${action('meter-result', id)} aria-pressed="${result === id}">${icon(ctx, result === id ? 'circle-check' : 'circle')}${label}</button>`).join('')}</div>${result === 'unsuitable' ? field(ctx, 'Примечание к результату', 'meter.resultNote', m.resultNote || '', { placeholder: 'Если нужно уточнение' }) : ''}</section>
      ${advanced && !gas ? conditions(ctx, 'after') : ''}
      ${errorFor(ctx, 'meter.measurements') ? `<section class="section"><p id="error-meter.measurements" class="field-error danger">${esc(errorFor(ctx, 'meter.measurements'))}</p><button type="button" class="secondary" data-nav="strains" aria-invalid="true" aria-describedby="error-meter.measurements">Перейти к измерениям</button></section>` : ''}
      ${m.readinessText ? `<p class="section helper">${esc(m.readinessText)}</p>` : ''}
      ${!gas ? `<div class="section">${nav(ctx, 'Проверить измерения', 'strains', '', 'text-button', 'chevron-left')}</div>` : ''}
      <div class="bottom-actions"><small class="muted">Сохранение на телефоне</small>${button(ctx, 'Сохранить и вернуться к акту', 'meter-save', '', 'primary', 'check')}${button(ctx, 'Сохранить незавершённым', 'meter-save-draft', '', 'text-button')}</div>
    </div>`;

    return `<div class="form-screen form-v2 stack">
      ${steps(ctx, 'data')}${heading(serviceName)}
      <section class="section">
        ${photo(ctx, 'Счётчик', 'meter.face', 'На фотографии должны читаться название и заводской номер.', !m.isNew && m.photoAdded !== false)}
        ${recognized ? `<div class="recognition-note"><span>${m.confidence ? `Распознано · ${esc(m.confidence)}%. ` : ''}Сверьте название и номер с фото.</span>${button(ctx, 'Проверено', 'recognition-confirm', '', 'text-button', 'check')}</div>` : m.recognitionConfirmed ? '<p class="helper success">Данные с фото проверены</p>' : ''}
        ${field(ctx, 'Название и модель', 'meter.model', m.model ?? (m.isNew ? '' : 'БЕТАР СХВ-15'), { required: true })}
        ${field(ctx, 'Заводской номер', 'meter.serial', m.serial ?? (m.isNew ? '' : '28476193'), { required: true })}
        ${field(ctx, 'Номер в Госреестре', 'meter.registry', m.registry ?? (m.isNew ? '' : '64028-16'), { required: true })}
        ${button(ctx, 'Выбрать в реестре', 'meter-registry', '', 'text-button', 'search')}
      </section>
      ${disclosure('Параметры поверки', gas ? 'Газ' : `${m.setup === 'nepton' ? 'Нептон' : 'Другая установка'}${advanced ? ' · СМК' : ''}`, `${select(ctx, 'Тип счётчика', 'meter.service', m.service || 'cold', [['cold', 'Холодная вода'], ['hot', 'Горячая вода'], ['gas', 'Газ']])}${!gas ? `${select(ctx, 'Установка счётчика', 'meter.installation', m.installation || 'horizontal', [['horizontal', 'Горизонтально'], ['vertical', 'Вертикально']])}${select(ctx, 'Диаметр', 'meter.diameter', m.diameter || '15', [['15', 'Ду15'], ['20', 'Ду20']])}${select(ctx, 'Поверочная установка', 'meter.setup', m.setup || 'manual', [['manual', 'Другая установка'], ['nepton', 'Нептон']])}${select(ctx, 'Методика', 'meter.method', m.method || 'photo', [['photo', 'С фотофиксацией'], ['standard', 'Без фотофиксации']])}${checkbox(ctx, 'Расширенная СМК', 'meter.advanced', advanced)}` : ''}<p>${esc(m.methodLabel || (gas ? 'Методика выбранного типа СИ' : methodPhoto ? 'ГОСТ 8.1012-2022' : 'МИ 1592-2015'))}</p><p class="helper">Межповерочный интервал: ${esc(m.interval || '6 лет')}.</p>`, { className: 'section', open: ['service','installation','diameter','setup','method','advanced'].some((key) => errorFor(ctx, 'meter.' + key)) || m.openSection === 'parameters' })}
      ${!methodPhoto && !gas ? `<section class="section">${field(ctx, 'Помещение', 'meter.place', m.place ?? 'Кухня')}</section>` : ''}
      ${conditions(ctx, 'before')}
      <div class="bottom-actions">${gas ? button(ctx, 'Далее — результат', 'meter-step', 'result', 'primary', 'arrow-right') : nav(ctx, 'Далее — измерения', 'strains', '', 'primary', 'arrow-right')}${button(ctx, 'Сохранить черновик и к акту', 'meter-save-draft', '', 'text-button')}</div>
    </div>`;
  }

  function strains(ctx) {
    const m = slice(ctx, 'meter');
    const s = slice(ctx, 'strains');
    const methodPhoto = m.method !== 'standard';
    const nepton = m.setup === 'nepton';
    const advanced = m.advanced !== false;
    if (m.service === 'gas') return meter({ ...ctx, state: { ...stateOf(ctx), meter: { ...m, step: 'result' } } });
    if (!methodPhoto && !advanced) return `<div class="form-screen form-v2 stack">${steps(ctx, 'measure')}${heading('Измерения')}<section class="section"><p>В этом режиме параметры проливов заполняются автоматически.</p></section><div class="bottom-actions">${button(ctx, 'Далее — результат', 'meter-step', 'result', 'primary', 'arrow-right')}${button(ctx, 'К данным счётчика', 'meter-step', 'data', 'text-button')}</div></div>`;
    const total = methodPhoto && nepton ? 3 : 9;
    const current = Math.max(1, Math.min(total, Number(s.current) || 1));
    const completed = Math.max(0, Math.min(total, Number(s.completed) || 0));
    const group = Math.floor((current - 1) / (total === 3 ? 1 : 3));
    const groupTitle = ['Минимальный расход', 'Переходный расход × 1,1', 'Максимальный расход'][group];
    const profile = { horizontal15: ['0,03', 7, '0,132', 15, 17], horizontal20: ['0,05', 12, '0,22', 25, 26], vertical15: ['0,06', 14, '0,165', 19, 17], vertical20: ['0,1', 24, '0,275', 31, 26] }[(m.installation || 'horizontal') + (m.diameter || '15')] || ['0,03', 7, '0,132', 15, 17];
    const target = group === 0 ? `${profile[0]} м³/ч · не менее ${profile[1]} л` : group === 1 ? `${profile[2]} м³/ч · не менее ${profile[3]} л` : `Максимальный расход · не менее ${profile[4]} л`;
    const values = obj(s.values);
    const val = (key) => values[`${current}.${key}`] ?? '';
    const stepId = `strain.${current}`;
    const showNumbers = !methodPhoto || advanced || !nepton;
    const prepNeeded = methodPhoto && (!hasPhoto(ctx, 'standard.connections') || (advanced || !internal(ctx)) && !hasPhoto(ctx, 'standard.serial'));

    return `<div class="form-screen form-v2 stack">
      ${steps(ctx, 'measure')}${heading(`Пролив ${current} из ${total}`, groupTitle)}
      <section class="sheet measurement-target"><strong>${esc(s.instruction || target)}</strong><div class="row between"><span class="helper">${completed} завершено</span>${button(ctx, 'Все проливы', 'strains-overview', '', 'text-button')}</div><progress value="${completed}" max="${total}" aria-label="Завершено ${completed} из ${total}"></progress></section>
      ${current === 1 ? disclosure('Перед первым проливом', s.preparationComplete ? 'Готово' : prepNeeded ? 'Добавить фото' : 'Проверить', `${advanced ? `${checkbox(ctx, 'Внешний осмотр пройден', 'strains.inspected', s.inspected !== false)}${methodPhoto ? checkbox(ctx, 'Соответствие ПО подтверждено', 'strains.software', s.software !== false) : ''}${checkbox(ctx, 'Опробование пройдено', 'strains.tested', s.tested !== false)}` : ''}${methodPhoto ? `${photo(ctx, 'Эталон с подключениями', 'standard.connections', 'Эталон и подключения должны быть видны целиком.')}${advanced || !internal(ctx) ? `${photo(ctx, 'Номер эталона', 'standard.serial', 'Заводской номер или этикетка должны читаться.')}${button(ctx, 'Средства поверки · до 5 фото', 'verification-means', '', 'text-button', 'camera')}` : '<p class="helper">Данные закреплённого эталона добавятся при отправке.</p>'}` : ''}`, { className: 'section', tone: s.preparationComplete ? 'success' : 'warning', open: prepNeeded || hasErrors(ctx, 'standard.') || hasErrors(ctx, 'strains.') || s.openSection === 'preparation' }) : ''}
      ${nepton ? `<section class="section"><button type="button" class="list-row task-row" ${action('nepton-open')}>${icon(ctx, 'wifi')}<span><b>Нептон</b><small class="${s.connected ? 'success' : ''}">${s.connected ? 'Подключён' : 'Подключить установку'}</small></span>${icon(ctx, 'chevron-right')}</button></section>` : ''}
      <section class="section stack">
        ${methodPhoto ? `<div class="field-pair">${field(ctx, 'До пролива, м³', `${stepId}.beforeReading`, val('beforeReading'), { inputmode: 'decimal', placeholder: 'Показания' })}${field(ctx, 'После, м³', `${stepId}.afterReading`, val('afterReading'), { inputmode: 'decimal', placeholder: 'Показания' })}</div>${nepton ? photo(ctx, 'Счётчик до пролива', `${stepId}.before`, 'Снимок до начала измерения.') : ''}${photo(ctx, 'Счётчик после пролива', `${stepId}.after`, 'Шкала и заводской номер должны читаться.')}${advanced || !nepton ? photo(ctx, 'Эталон после пролива', `${stepId}.standard`, 'Добавьте снимок результата на эталоне.') : ''}` : field(ctx, 'Объём по счётчику, м³', `${stepId}.meterVolume`, val('meterVolume'), { inputmode: 'decimal' })}
        ${showNumbers ? `<div class="field-pair">${field(ctx, 'Расход, м³/ч', `${stepId}.flow`, val('flow'), { inputmode: 'decimal' })}${field(ctx, 'По эталону, м³', `${stepId}.standardVolume`, val('standardVolume'), { inputmode: 'decimal' })}${field(ctx, 'Время, с', `${stepId}.duration`, val('duration'), { inputmode: 'decimal' })}${field(ctx, 'Погрешность, %', `${stepId}.error`, val('error'), { inputmode: 'decimal' })}</div>` : ''}
      </section>
      ${current > 1 ? `<div class="section">${button(ctx, 'Предыдущий пролив', 'strain-prev', String(current), 'text-button', 'arrow-left')}</div>` : ''}
      <div class="bottom-actions">${button(ctx, current === total ? 'Проверить и к результату' : `Сохранить пролив · далее ${current + 1} из ${total}`, 'strain-next', String(current), 'primary', 'arrow-right')}${button(ctx, 'Сохранить черновик и закрыть', 'strains-save-draft', '', 'text-button')}</div>
    </div>`;
  }

  function upload(ctx) {
    const u = slice(ctx, 'upload');
    const connected = online(ctx);
    const items = Array.isArray(u.items) ? u.items : [
      { id: '01428', number: '247-26-01428', address: 'Лесная, 8 · кв. 24', status: 'incomplete', message: 'Не хватает фото акта и фото одного пролива.' },
      { id: '01427', number: '247-26-01427', address: 'Мира, 14 · кв. 7', status: 'ready', message: '2 счётчика. Все обязательные данные заполнены.' },
      { id: '01426', number: '247-26-01426', address: 'Мира, 12 · кв. 18', status: 'error', message: 'Сервер не ответил. Данные сохранены на телефоне.' },

    const parts=path.split('.');let dest=S;for(let i=0;i<parts.length-1;i++){if(!dest[parts[i]]||typeof dest[parts[i]]!=='object')dest[parts[i]]={};dest=dest[parts[i]];}dest[parts.at(-1)]=value;

  }

if(globalThis.Tweak){const tweak=new Tweak({container:lab,onChange:()=>{experimentState.shared.active=true;for(const [id,app]of Object.entries(experimentApps)){app.present(experimentState.shared);experimentState.designs[id]={...experimentState.designs[id],...experimentState.shared};}persistExperimentGallery();}});tweak.addSelect(experimentState.shared,'theme',{label:'Тема всех вариантов',options:[{label:'Как на устройстве',value:'auto'},{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}],reference:'pd.experiments.theme'});tweak.addSlider(experimentState.shared,'fontScale',{label:'Размер текста во всех вариантах',min:1,max:2,step:.1,reference:'pd.experiments.scale'});}
lab.addEventListener('change',e=>{const input=e.target;if(!input.hasAttribute('data-pick'))return;const choices=new Set(experimentState.picks[input.dataset.design]||[]);input.checked?choices.add(input.value):choices.delete(input.value);experimentState.picks[input.dataset.design]=[...choices];renderExperimentPicks();persistExperimentGallery();});
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(saved?.revision!=='experiments-1'||saved.session===experimentSession||experimentEdits>0)return;experimentState.picks={...saved.picks};renderExperimentPicks();for(const [id,p]of Object.entries(saved.designs||{}))experimentApps[id]?.restore(p);});

</script>
