      ${issues.length ? `<section class="pd-section" aria-label="Причины неготовности">
        ${issues.map((issue, index) => `<div ${index ? 'class="pd-separator"' : ''}></div>
          <button type="button" class="pd-row pd-between" style="width:100%;min-height:72px;text-align:left;padding:8px 0;color:#181818" data-action="validation-fix-${issue.id}">
            <span class="pd-row">${H.icon(issue.icon)}<span><span class="pd-text" style="display:block">${actViewEscape(issue.title)}</span><span class="pd-meta" style="display:block">${actViewEscape(issue.detail)}</span></span></span>
            ${H.icon('chevron')}
          </button>`).join('')}
      </section>` : `<section class="pd-section pd-stack" aria-label="Исправленные данные">
        <div class="pd-row">${H.icon('check')}<p class="pd-text">Показание: ${actViewEscape(state.reading)} м³</p></div>
        <div class="pd-row">${H.icon('check')}<p class="pd-text">Фото счётчика добавлено</p></div>
      </section>`}
      ${state.reading && issues.length ? `<p class="pd-inline-status">${H.icon('check')} Показание сохранено: ${actViewEscape(state.reading)} м³</p>` : ''}
      ${state.photoAttached && issues.length ? `<p class="pd-inline-status">${H.icon('check')} Фото счётчика добавлено</p>` : ''}
      ${state.invalid && !state.editing ? '<p class="pd-error" role="status">Сначала исправьте указанные замечания.</p>' : ''}
      <button type="button" class="pd-action" data-action="validation-check">Проверить готовность</button>
    </div>`;
  },
  action: (state, name) => {
    if (name === 'validation-fix-reading') {
      state.editing = 'reading'; state.invalid = false; return true;
    }
    if (name === 'validation-fix-photo') { state.editing = 'photo'; state.invalid = false; return true; }
    if (name === 'validation-back') { state.editing = ''; state.invalid = false; return true; }
    if (name === 'validation-save-reading') {
      state.invalid = !actViewNumber(state.readingDraft);
      if (!state.invalid) { state.reading = String(state.readingDraft).trim(); state.editing = ''; }
      return true;
    }
    if (name === 'validation-add-photo') { state.photoAttached = true; state.editing = ''; state.invalid = false; return true; }
    if (name === 'validation-check') { state.ready = validationIssues(state).length === 0; state.invalid = !state.ready; return true; }
    if (name === 'validation-return') { state.ready = false; return true; }
    return false;
  }
};

/* Hypothesis 5. Local state only: no network requests, timers or real uploads. */
views.sync = {
  title: 'Акты',
  nav: 'acts',
  initial: () => ({
    online: false,
    page: 'list',
    feedback: '',
    sentIds: [],
    receipt: null,
    documents: [
      { id: '0416', address: 'Комсомольская, 15', status: 'queued' },
      { id: '0417', address: 'Лесная, 7', status: 'draft', reason: 'Нет подписи клиента' },
      { id: '0415', address: 'Строителей, 18', status: 'received' }
    ]
  }),
  render: state => {
    const e = H.escape;
    const queued = state.documents.filter(item => item.status === 'queued');
    const draft = state.documents.find(item => item.status === 'draft');
    if (state.page === 'result' && state.receipt) {
      return `<div class="pd-stack pd-sync-result">
        <button type="button" class="pd-small-action" data-action="sync-back">${H.icon('back')} К списку актов</button>
        <section class="pd-section pd-stack" aria-label="Результат отправки">
          <div class="pd-row"><span aria-hidden="true">${H.icon('check')}</span><div class="pd-title">Акт передан</div></div>
          <p class="pd-text">Сервер подтвердил получение акта №${e(state.receipt.ids.join(', №'))}.</p>
          <p class="pd-muted">Повторно отправлять его не нужно.</p>
        </section>
        ${draft ? `<section class="pd-section pd-stack" aria-label="Неотправленный черновик">
          <div class="pd-title">Черновик №${e(draft.id)} остался на телефоне</div>
          <p class="pd-text">${e(draft.reason)}. Он не включался в отправку.</p>
          <button type="button" class="pd-action" data-action="sync-draft">Проверить черновик</button>
        </section>` : ''}
      </div>`;
    }
    if (state.page === 'draft') {
      return `<div class="pd-stack pd-sync-draft">
        <button type="button" class="pd-small-action" data-action="sync-back">${H.icon('back')} К списку актов</button>
        <section class="pd-section pd-stack">
          <div class="pd-title">Черновик №${e(draft ? draft.id : '0417')}</div>
          <p class="pd-muted">${e(draft ? draft.address : 'Лесная, 7')}</p>
          <div class="pd-inline-status">${H.icon('check')} Сохранён на телефоне</div>
          <div class="pd-error"><p class="pd-text">Для отправки нужна подпись клиента.</p></div>
          <p class="pd-muted">Остальные заполненные сведения сохранены.</p>
        </section>
      </div>`;
    }
    const documents = state.documents.map(item => {
      const status = item.status === 'received' ? 'Сервер подтвердил получение'
        : item.status === 'draft' ? 'Черновик · сохранён на телефоне'
        : state.online ? 'Готов к отправке' : 'Ожидает подключения';
      const icon = item.status === 'received' ? 'check' : item.status === 'draft' ? 'edit' : 'upload';
      return `<section class="pd-section pd-stack pd-sync-document" data-document-id="${e(item.id)}" data-document-status="${e(item.status)}" aria-label="Акт №${e(item.id)}">
        <div class="pd-row pd-between"><div class="pd-title">Акт №${e(item.id)}</div><span aria-hidden="true">${H.icon(icon)}</span></div>
        <p class="pd-muted">${e(item.address)}</p>
        <div class="pd-inline-status pd-text">${e(status)}</div>
        ${item.status === 'draft' ? `<p class="pd-text">${e(item.reason)}</p><button type="button" class="pd-small-action" data-action="sync-draft">Что нужно исправить ${H.icon('chevron')}</button>` : ''}
      </section>`;
    }).join('');
    return `<div class="pd-stack pd-sync-list">
      <section class="pd-section pd-stack pd-sync-connection" aria-label="Подключение">
        <div class="pd-row"><span aria-hidden="true">${H.icon(state.online ? 'check' : 'offline')}</span><div class="pd-title">${state.online ? 'Есть интернет' : 'Нет интернета'}</div></div>
        <p class="pd-text">${state.online ? 'Можно передать готовые акты.' : 'Акты сохранены на телефоне. Можно продолжать работу.'}</p>
        ${!state.online ? '<button type="button" class="pd-small-action" data-action="sync-connect">Проверить подключение</button>' : ''}
      </section>
      <div class="pd-stack">
        <button type="button" class="pd-action${state.online && queued.length ? ' pd-primary' : ''}" data-action="sync-send"${state.online && queued.length ? '' : ' disabled'}>${H.icon('upload')} ${queued.length ? 'Отправить готовый акт' : 'Готовые акты переданы'}</button>
        ${queued.length ? `<p class="pd-meta">В отправку входит только акт №${e(queued[0].id)}.</p>` : ''}
        ${state.feedback ? `<p class="pd-text" role="status">${e(state.feedback)}</p>` : ''}
      </div>
      <div class="pd-stack" aria-label="Состояния актов">${documents}</div>
    </div>`;
  },
  action: (state, name) => {
    if (name === 'sync-connect') {
      state.online = true;
      state.feedback = 'Подключение есть. Акт ещё не отправлен.';
      return true;
    }
    if (name === 'sync-send') {
      if (!state.online) {
        state.feedback = 'Нет интернета. Акты остаются на телефоне.';
        return true;
      }
      const queued = state.documents.filter(item => item.status === 'queued');
      if (!queued.length) {
        state.feedback = 'Повторная отправка не нужна: готовые акты уже получены сервером.';
        return true;
      }
      const ids = queued.map(item => item.id);
      queued.forEach(item => { item.status = 'received'; });
      state.sentIds = [...new Set([...state.sentIds, ...ids])];
      state.receipt = { ids };
      state.page = 'result';
      state.feedback = '';
      return true;
    }
    if (name === 'sync-draft') {
      state.page = 'draft';
      return true;
    }
    if (name === 'sync-back') {
      state.page = 'list';
      return true;
    }
    return false;
  }
};

  const explanations = {
    queue:'Согласованные визиты идут по времени. Заявки без времени собраны отдельно. Порядок не меняется сам. Попробуйте поиск, фильтр и переключатель дат.',
    agreement:'Звонок и согласование доступны из списка. Кнопка «Согласовать» открывает короткую форму, а не полный экран заявки. Все действия здесь демонстрационные.',
    entry:'Доступные сведения уже перенесены. Их можно исправить. Пример распознавания сначала нужно проверить. Даже неполный черновик можно сохранить в макете.',
    validation:'Каждая причина ведёт к конкретному полю. Исправление одной ошибки сохраняет остальные сведения. Фото добавляется только как демонстрационный пример.',
    sync:'Сохранение на телефоне и получение сервером — разные состояния. Проверка подключения и отправка здесь моделируются, реальных обращений к серверу нет.'
  };
  const states = {};
  const boxes = [...root.querySelectorAll('[data-view]')];
  for (const phone of boxes) states[phone.dataset.view] = views[phone.dataset.view].initial();
  function persist() {
    if (!window.openai?.setWidgetState) return;
    const data = JSON.parse(JSON.stringify(states));
    window.openai.setWidgetState({modelContent:{concept:'Пять гипотез удобства',states:Object.fromEntries(Object.entries(data).map(([id,s])=>[id,{agreed:!!s.agreed,saved:!!s.saved,online:!!s.online,screen:s.enginePage||s.page||s.editing||'main'}]))},privateContent:{hypothesisStates:data}}).catch(()=>{});
  }
  function renderPhone(phone, resetScroll = false) {
    const id=phone.dataset.view, view=views[id], s=states[id];
    const old=phone.querySelector('.pd-body');
    const oldScroll=old?.scrollTop||0;
    const page=s.enginePage||'';
    const nested=(id==='entry'||id==='validation')&&!page;
    const title=page==='acts'?'Акты':page==='destination'?s.destinationTitle:view.title;
    const icons=nested?`<button class="pd-icon-button" type="button" data-action="engine-help" aria-label="Подсказка">${H.icon('help')}</button><button class="pd-icon-button" type="button" data-action="engine-profile" aria-label="Профиль">${H.icon('profile')}</button>`:
      `<span class="pd-icon-button" role="img" aria-label="Нет интернета" aria-hidden="${s.online!==false}">${s.online===false?H.icon('offline'):''}</span><button class="pd-icon-button" type="button" data-action="engine-help" aria-label="Подсказка">${H.icon('help')}</button><button class="pd-icon-button" type="button" data-action="engine-notifications" aria-label="Уведомления">${H.icon('bell')}</button><button class="pd-icon-button" type="button" data-action="engine-profile" aria-label="Профиль">${H.icon('profile')}</button>`;
    const main=page==='acts'?`<div class="pd-stack"><h2 class="pd-title">Незавершённая работа</h2><section class="pd-section pd-stack"><p class="pd-text">Акт №000393</p><p class="pd-muted">Комсомольская, 15</p><button class="pd-action" data-action="engine-resume" type="button">Продолжить работу</button></section><p class="pd-meta">Здесь показан только возврат к текущему акту.</p></div>`:
      page==='destination'?`<div class="pd-stack"><button class="pd-small-action" data-action="engine-resume" type="button">${H.icon('back')} Вернуться к примеру</button><p class="pd-muted">Этот раздел не входит в показ текущей гипотезы.</p></div>`:view.render(s);
    phone.innerHTML=`<header class="pd-header"><div class="pd-system" aria-hidden="true"><span>9:41</span><span class="pd-system-icons">${H.icon('signal')}${H.icon('wifi')}${H.icon('battery')}</span></div><div class="pd-toolbar ${nested?'pd-nested':''}">${nested?`<button class="pd-icon-button" type="button" data-action="engine-back" aria-label="Назад">${H.icon('back')}</button>`:''}<h1>${H.escape(title)}</h1><div class="pd-header-icons">${icons}</div></div></header><main class="pd-body" aria-label="${H.escape(title)}">${main}</main><footer class="pd-footer"><nav class="pd-nav" aria-label="Основные разделы">${[['bids','Заявки'],['acts','Акты'],['equipment','Приборы'],['guide','Справочник']].map(([key,label])=>`<button type="button" data-action="engine-nav" data-destination="${key}"${view.nav===key?' aria-current="page"':''}><span class="pd-nav-mark">${H.icon(key)}</span><span>${label}</span></button>`).join('')}</nav><div class="pd-gesture" aria-hidden="true"></div></footer><span class="pd-live" role="status">${s.engineAnnouncement?H.escape(s.engineAnnouncement):''}</span>${s.engineHelp?`<div class="pd-overlay"><section class="pd-overlay-panel pd-stack" role="dialog" aria-modal="true" aria-label="О гипотезе"><h2 class="pd-title">Что можно попробовать</h2><p>${H.escape(explanations[id])}</p><button class="pd-action" data-action="engine-close-help" type="button">Понятно</button></section></div>`:''}`;
    const body=phone.querySelector('.pd-body');
    if (!resetScroll) body.scrollTop=oldScroll;
    const dialog=phone.querySelector('[role="dialog"]');
    if (dialog) {
      phone.querySelector('.pd-header').setAttribute('inert','');
      phone.querySelector('.pd-footer').setAttribute('inert','');
      if(s.engineHelp) body.setAttribute('inert','');
      dialog.querySelector('input, select, button')?.focus?.({preventScroll:true});
    }
  }
  function restore(snapshot) {
    const saved=snapshot?.privateContent?.hypothesisStates;
    if(!saved||typeof saved!=='object')return;
    for(const id of Object.keys(states)) {
      const value=saved[id];
      if(!value||typeof value!=='object'||Array.isArray(value))continue;
      // Restore only fields belonging to the known demo-state contract.
      const allowed=new Set([...Object.keys(views[id].initial()),'enginePage','destinationTitle','engineHelp','engineAnnouncement']);
      for(const key of allowed)if(Object.hasOwn(value,key)) {
        const v=value[key];
        if(typeof v==='string'&&v.length<=2000||typeof v==='boolean'||typeof v==='number'||Array.isArray(v)&&v.length<=20||v===null||key==='receipt'&&typeof v==='object') states[id][key]=v;
      }
    }
    boxes.forEach(phone=>renderPhone(phone));
  }
  for (const phone of boxes) {
    phone.addEventListener('click',event=>{
      const el=event.target.closest('[data-action]');
      if(!el||el.disabled)return;
      const id=phone.dataset.view,s=states[id],name=el.dataset.action;
      let handled=true,resetScroll=false;
      if(name==='engine-help')s.engineHelp=true;
      else if(name==='engine-close-help')s.engineHelp=false;
      else if(name==='engine-resume'){s.enginePage='';resetScroll=true;}
      else if(name==='engine-back'){
        if(id==='entry'&&s.reviewOpen)views[id].action(s,'entry-cancel-review',el);
        else if(id==='entry'&&s.saved)views[id].action(s,'entry-continue',el);
        else if(id==='validation'&&s.editing)views[id].action(s,'validation-back',el);
        else {s.enginePage='acts';resetScroll=true;}
      }
      else if(name==='engine-nav'){
        const dest=el.dataset.destination;
        if(dest===views[id].nav){s.enginePage=dest==='acts'&&(id==='entry'||id==='validation')?'acts':'';}
        else {s.enginePage='destination';s.destinationTitle={bids:'Заявки',acts:'Акты',equipment:'Приборы',guide:'Справочник'}[dest];}
        resetScroll=true;
      }
      else if(name==='engine-profile'||name==='engine-notifications'){s.enginePage='destination';s.destinationTitle=name==='engine-profile'?'Профиль':'Уведомления';resetScroll=true;}
      else handled=views[id].action(s,name,el);
      if(handled){renderPhone(phone,resetScroll);persist();}
    });
    const update=event=>{
      const field=event.target.closest('[data-field]');
      if(!field)return;
      const s=states[phone.dataset.view],key=field.dataset.field;
      if(Object.hasOwn(s,key)&&typeof s[key]!=='object')s[key]=field.value;
      if(event.type==='change'&&phone.dataset.view==='queue')renderPhone(phone);
      persist();
    };
    phone.addEventListener('input',update);
    phone.addEventListener('change',update);
    phone.addEventListener('keydown',event=>{
      const dialog=phone.querySelector('[role="dialog"]');
      if(!dialog)return;
      if(event.key==='Escape'){
        const s=states[phone.dataset.view];
        if(s.engineHelp)s.engineHelp=false; else if(phone.dataset.view==='agreement')views.agreement.action(s,'agree-cancel');
        event.preventDefault();renderPhone(phone);persist();return;
      }
      if(event.key==='Tab'){
        const fields=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),a[href]')];
        const first=fields[0],last=fields[fields.length-1];
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus?.();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus?.();}
      }
    });
    renderPhone(phone);
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
})();


</script>
