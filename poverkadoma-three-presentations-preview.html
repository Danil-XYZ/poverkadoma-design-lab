const statusKinds=[['new','Новая'],['appointed','Назначена'],['agreed','Согласована'],['canceled','Отменена']];
const initialThree=()=>({period:'today',query:'',searchOpen:false,filter:'all',filterOpen:false,notice:'',detailsId:'',actionId:'',actionMode:'',column:'new',jumpTo:'',draftDate:today,draftSlot:'14:00–15:00',invalid:false});
const filteredRequests=s=>demoRequests.filter(x=>(s.period==='all'||!x.visitDate||x.visitDate===today)&&(s.filter==='all'||x.kind===s.filter)&&`${x.address} ${x.city} ${x.id} ${x.phone}`.toLowerCase().includes(s.query.toLowerCase().trim()));
const requestLink=x=>`<button class="pd-request-link" type="button" data-action="request-open" data-id="${x.id}" aria-label="Открыть заявку №${x.id}: ${H.escape(x.address)}"><span class="pd-title">${H.escape(x.address)}</span>${H.icon('chevron')}</button>`;
const metaLine=x=>`<p class="pd-meta">№${x.id} · ${H.escape(x.city)}</p><p class="pd-meta">Создана ${x.created}</p>`;
const statusLabel=x=>`<span class="pd-inline-status"><span class="pd-dot ${x.kind==='new'?'pd-red':x.kind==='appointed'?'pd-amber':x.kind==='canceled'?'pd-neutral':''}"></span>${x.state}</span>`;
const visitLine=x=>x.visitDate?`Визит: ${x.visitDate.split('-').reverse().join('.')} · ${x.start}–${x.end}`:x.dueLabel||'Время визита не назначено';
const rowActions=x=>`<div class="pd-actions"><button class="pd-action" type="button" data-action="request-primary" data-id="${x.id}" aria-label="${x.action}, заявка №${x.id}">${x.action}</button><button class="pd-square" type="button" data-action="request-call" data-id="${x.id}" aria-label="Позвонить по номеру ${x.phone}, заявка №${x.id}">${H.icon('phone')}</button></div>`;
const fullRequest=x=>`<article class="pd-section pd-stack pd-board-card" data-request-id="${x.id}">${requestLink(x)}${metaLine(x)}<p class="pd-text">${H.escape(x.phone)}</p><p class="pd-text">${H.escape(visitLine(x))}</p>${rowActions(x)}</article>`;
const toolbar=s=>`<div class="pd-stack pd-three-tools"><div class="pd-toolbar-controls"><div class="pd-segment" role="group" aria-label="Период заявок"><button type="button" data-action="three-today" aria-pressed="${s.period==='today'}">Сегодня</button><button type="button" data-action="three-all" aria-pressed="${s.period==='all'}">Все</button></div><button class="pd-square" type="button" data-action="three-search" aria-label="Поиск" aria-expanded="${s.searchOpen}">${H.icon('search')}</button><button class="pd-square" type="button" data-action="three-filter" aria-label="Фильтр" aria-expanded="${s.filterOpen}">${H.icon('funnel')}</button></div>${s.searchOpen?`<label class="pd-field"><span>Адрес, телефон или номер</span><input class="pd-input" type="search" data-field="query" value="${H.escape(s.query)}"><button class="pd-small-action" type="button" data-action="three-find">Найти</button></label>`:''}${s.filterOpen?`<label class="pd-field"><span>Статус заявки</span><select class="pd-input" data-field="filter"><option value="all"${s.filter==='all'?' selected':''}>Все статусы</option>${statusKinds.map(([key,label])=>`<option value="${key}"${s.filter===key?' selected':''}>${label}</option>`).join('')}</select></label>`:''}</div>`;

views.list={title:'Заявки',nav:'bids',initial:initialThree,render:s=>{
  const items=filteredRequests(s);
  return `<div class="pd-heading-row"><p class="pd-muted">${s.period==='today'?'Сегодня, 28 октября':'Все даты'}</p><span class="pd-meta">${items.length} заявок</span></div><div class="pd-work-heading"><span>Заявка</span><span>Действия</span></div><section class="pd-working-list" aria-label="Рабочий список">${items.map(x=>`<article class="pd-work-row" data-request-id="${x.id}"><div class="pd-work-info">${statusLabel(x)}${requestLink(x)}<p class="pd-text">${H.escape(visitLine(x))}</p>${metaLine(x)}<p class="pd-muted">${H.escape(x.phone)}</p></div><div class="pd-work-actions">${rowActions(x)}</div></article>`).join('')||'<p class="pd-muted pd-empty">Заявки не найдены.</p>'}</section>`;
},action:()=>false};

const minute=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const timeLabel=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function clusters(items){const result=[];for(const x of [...items].sort((a,b)=>minute(a.start)-minute(b.start))){const start=minute(x.start),end=minute(x.end),last=result[result.length-1];if(last&&start<last.end){last.items.push(x);last.end=Math.max(last.end,end);}else result.push({start,end,items:[x]});}return result;}
views.schedule={title:'Заявки',nav:'bids',initial:initialThree,render:s=>{
  const items=filteredRequests(s),timed=items.filter(x=>x.visitDate&&x.start&&x.end),without=items.filter(x=>!x.visitDate||!x.start||!x.end);
  const dates=[...new Set(timed.map(x=>x.visitDate))].sort();
  return `<div class="pd-stack"><div class="pd-heading-row"><h2 class="pd-title">${s.period==='today'?'28 октября, среда':'Расписание визитов'}</h2><span class="pd-meta">${timed.length} визита</span></div>${without.length?`<button class="pd-small-action pd-between" type="button" data-action="schedule-without"><span>Без времени: ${without.length}</span>${H.icon('chevron')}</button>`:''}${dates.map(date=>{
    const groups=clusters(timed.filter(x=>x.visitDate===date));
    return `${s.period==='all'?`<h3 class="pd-title">${date.split('-').reverse().join('.')}</h3>`:''}<div class="pd-agenda">${groups.map((group,index)=>{
      const previous=groups[index-1];
      const gap=previous&&group.start>previous.end?`<div class="pd-agenda-gap"><span>${timeLabel(previous.end)}<br>${timeLabel(group.start)}</span><p>Между визитами ${Math.floor((group.start-previous.end)/60)} ч ${(group.start-previous.end)%60} мин</p></div>`:'';
      return `${gap}<div class="pd-agenda-group"${group.items.length>1?' data-overlap="true"':''}><div class="pd-agenda-time"><strong>${timeLabel(group.start)}</strong><span>до ${timeLabel(group.end)}</span></div><div class="pd-stack pd-agenda-events">${group.items.length>1?'<p class="pd-error">Визиты пересекаются по времени.</p>':''}${group.items.map(x=>`<article class="pd-section pd-stack" data-request-id="${x.id}"><p class="pd-title">${x.start}–${x.end}</p>${statusLabel(x)}${requestLink(x)}${metaLine(x)}<p class="pd-muted">${H.escape(x.phone)}</p>${rowActions(x)}</article>`).join('')}</div></div>`;
    }).join('')}</div>`;
  }).join('')}${!timed.length?'<p class="pd-muted">Визитов с согласованным временем нет.</p>':''}${without.length?`<section class="pd-stack" data-without-time><div><h2 class="pd-title">Без согласованного времени</h2><p class="pd-muted">Эти заявки не размещены на временной оси.</p></div>${without.map(x=>`<article class="pd-section pd-stack" data-request-id="${x.id}">${statusLabel(x)}${requestLink(x)}${metaLine(x)}<p class="pd-muted">${H.escape(x.phone)}</p><p>${H.escape(visitLine(x))}</p>${rowActions(x)}</article>`).join('')}</section>`:''}</div>`;
},action:(s,name)=>{if(name==='schedule-without'){s.jumpTo='without';return true;}return false;},afterRender:(phone,s)=>{if(s.jumpTo==='without'){const body=phone.querySelector('.pd-body'),target=phone.querySelector('[data-without-time]');if(target)body.scrollTop=target.offsetTop;s.jumpTo='';}}};

views.board={title:'Заявки',nav:'bids',initial:initialThree,render:s=>{
  const items=filteredRequests(s),index=Math.max(0,statusKinds.findIndex(([key])=>key===s.column));
  return `<div class="pd-stack"><div class="pd-board-controls"><button class="pd-square" type="button" data-action="board-prev" aria-label="Предыдущий статус">${H.icon('back')}</button><label class="pd-field"><span class="pd-meta">Статус</span><select class="pd-input" data-field="column">${statusKinds.map(([key,label])=>`<option value="${key}"${s.column===key?' selected':''}>${label} · ${items.filter(x=>x.kind===key).length}</option>`).join('')}</select></label><button class="pd-square" type="button" data-action="board-next" aria-label="Следующий статус">${H.icon('chevron')}</button></div><div class="pd-row pd-between"><span class="pd-meta">Колонки можно листать</span><span class="pd-meta pd-board-position">${index+1} / ${statusKinds.length}</span></div><div class="pd-board-track" aria-label="Доска заявок по статусам">${statusKinds.map(([key,label])=>`<section class="pd-board-column" data-board-column="${key}" aria-label="${label}"><div class="pd-row pd-between pd-column-heading"><h2 class="pd-title">${label}</h2><span>${items.filter(x=>x.kind===key).length}</span></div><div class="pd-stack">${items.filter(x=>x.kind===key).map(fullRequest).join('')||'<p class="pd-muted">Заявок нет</p>'}</div></section>`).join('')}</div></div>`;
},action:(s,name)=>{const current=Math.max(0,statusKinds.findIndex(([key])=>key===s.column));if(name==='board-prev'||name==='board-next'){s.column=statusKinds[(current+(name==='board-next'?1:-1)+statusKinds.length)%statusKinds.length][0];return true;}return false;},afterRender:(phone,s,persist)=>{
  const track=phone.querySelector('.pd-board-track');if(!track)return;
  const columns=[...track.querySelectorAll('[data-board-column]')],target=columns.find(x=>x.dataset.boardColumn===s.column);
  if(target)track.scrollLeft=target.offsetLeft;
  track.addEventListener('scroll',()=>{let nearest=columns[0];for(const x of columns)if(Math.abs(x.offsetLeft-track.scrollLeft)<Math.abs(nearest.offsetLeft-track.scrollLeft))nearest=x;if(nearest&&nearest.dataset.boardColumn!==s.column){s.column=nearest.dataset.boardColumn;const select=phone.querySelector('[data-field="column"]');if(select)select.value=s.column;const counter=phone.querySelector('.pd-board-position');if(counter)counter.textContent=(columns.indexOf(nearest)+1)+' / '+columns.length;persist?.();}},{passive:true});
}};

function commonSurface(s){
  if(s.detailsId){const x=demoRequests.find(x=>x.id===s.detailsId);return `<div class="pd-stack"><button class="pd-small-action" type="button" data-action="demo-close">${H.icon('back')} К заявкам</button><section class="pd-section pd-stack"><h2 class="pd-title">Заявка №${x.id}</h2><p class="pd-muted">Отдельный экран заявки ещё не спроектирован.</p></section></div>`;}
  if(s.actionId){const x=demoRequests.find(x=>x.id===s.actionId);return `<div class="pd-stack"><button class="pd-small-action" type="button" data-action="demo-close">${H.icon('back')} К заявкам</button><h2 class="pd-title">${x.action}</h2><section class="pd-section pd-stack"><p class="pd-title">${H.escape(x.address)}</p><p class="pd-muted">Заявка №${x.id}</p>${x.kind==='appointed'?`<label class="pd-field"><span>Дата визита</span><input class="pd-input" type="date" data-field="draftDate" value="${H.escape(s.draftDate)}"></label><label class="pd-field"><span>Интервал</span><select class="pd-input" data-field="draftSlot">${['11:00–12:00','14:00–15:00','15:00–16:00'].map(v=>`<option${v===s.draftSlot?' selected':''}>${v}</option>`).join('')}</select></label>${s.invalid?'<p class="pd-error">Укажите дату и интервал.</p>':''}<button class="pd-action" type="button" data-action="demo-save">Согласовать в макете</button>`:'<p class="pd-muted">Здесь показан вход в действие. Его отдельная форма не входит в сравнение представлений.</p>'}</section></div>`;}
  return '';
}
function commonAction(s,name,el){
  if(name==='three-today'){s.period='today';return true;}if(name==='three-all'){s.period='all';return true;}
  if(name==='three-search'){s.searchOpen=!s.searchOpen;if(!s.searchOpen)s.query='';return true;}
  if(name==='three-filter'){s.filterOpen=!s.filterOpen;return true;}if(name==='three-find')return true;
  if(name==='request-open'){s.detailsId=el.dataset.id;return true;}
  if(name==='request-primary'){s.actionId=el.dataset.id;s.invalid=false;return true;}
  if(name==='request-call'){const x=demoRequests.find(x=>x.id===el.dataset.id);s.notice=`Пример звонка: ${x.phone}. Реальный звонок не выполняется.`;return true;}
  if(name==='demo-close'){s.detailsId='';s.actionId='';return true;}
  if(name==='demo-save'){if(!/^\d{4}-\d{2}-\d{2}$/.test(s.draftDate)||!s.draftSlot){s.invalid=true;return true;}s.notice=`Пример: время визита ${s.draftDate.split('-').reverse().join('.')} ${s.draftSlot}. Исходные данные сравнения не изменены.`;s.actionId='';return true;}
  return false;
}
for(const view of Object.values(views)){const originalRender=view.render,originalAction=view.action;view.render=s=>commonSurface(s)||`<div class="pd-stack">${toolbar(s)}${s.notice?`<p class="pd-schedule-line" role="status">${H.escape(s.notice)}</p>`:''}${originalRender(s)}</div>`;view.action=(s,name,el)=>commonAction(s,name,el)||originalAction(s,name,el);}

  const explanations = {
    list:'Рабочий список: у каждого элемента данные слева, действия справа. Поиск, даты и фильтр одинаковы во всех трёх представлениях.',
    schedule:'Расписание: время слева, визиты на временной оси. Высота блоков зависит от содержания. Промежутки и пересечения отмечены словами. Заявки без времени доступны отдельной секцией.',
    board:'Доска: заявки распределены по исходным статусам. Используйте список статусов, стрелки или горизонтальную прокрутку. Статус не меняется перетаскиванием.'
  };
  const states = {};
  const boxes = [...root.querySelectorAll('[data-view]')];
  for (const phone of boxes) states[phone.dataset.view] = views[phone.dataset.view].initial();
  function persist() {
    if (!window.openai?.setWidgetState) return;
    const data = JSON.parse(JSON.stringify(states));
    window.openai.setWidgetState({modelContent:{concept:'Три представления заявок',states:Object.fromEntries(Object.entries(data).map(([id,s])=>[id,{agreed:!!s.agreed,saved:!!s.saved,online:!!s.online,screen:s.enginePage||s.page||s.editing||'main'}]))},privateContent:{hypothesisStates:data}}).catch(()=>{});
  }
  function renderPhone(phone, resetScroll = false) {
    const id=phone.dataset.view, view=views[id], s=states[id];
    const old=phone.querySelector('.pd-body');
    const oldScroll=old?.scrollTop||0;
    const page=s.enginePage||'';
    const nested=(id==='entry'||id==='validation')&&!page;
    const title=page==='acts'?'Акты':page==='destination'?s.destinationTitle:view.title;
    const icons=nested?`<button class="pd-icon-button" type="button" data-action="engine-help" aria-label="Подсказка">${H.icon('help')}</button><button class="pd-icon-button" type="button" data-action="engine-profile" aria-label="Профиль">${H.icon('profile')}</button>`:
      `<span class="pd-icon-button" role="img" aria-label="Нет интернета" aria-hidden="${s.online!==false}">${s.online===false?H.icon('offline'):''}</span><button class="pd-icon-button" type="button" data-action="engine-help" aria-label="Подсказка">${H.icon('help')}</button><button class="pd-icon-button" type="button" data-action="engine-notifications" aria-label="Уведомления">${H.icon('bell')}</button><button class="pd-icon-button" type="button" data-action="engine-profile" aria-label="Профиль">${H.icon('profile')}</button>`;
    const main=page==='acts'?`<div class="pd-stack"><h2 class="pd-title">Незавершённая работа</h2><section class="pd-section pd-stack"><p class="pd-text">Акт №000393</p><p class="pd-muted">Комсомольская, 15</p><button class="pd-action" data-action="engine-resume" type="button">Продолжить работу</button></section><p class="pd-meta">Здесь показан только возврат к текущему акту.</p></div>`:
      page==='destination'?`<div class="pd-stack"><button class="pd-small-action" data-action="engine-resume" type="button">${H.icon('back')} Вернуться к примеру</button><p class="pd-muted">Этот раздел не входит в показ текущей гипотезы.</p></div>`:view.render(s);
    phone.innerHTML=`<header class="pd-header"><div class="pd-system" aria-hidden="true"><span>9:45</span><span class="pd-system-icons">${H.icon('signal')}${H.icon('wifi')}${H.icon('battery')}</span></div><div class="pd-toolbar ${nested?'pd-nested':''}">${nested?`<button class="pd-icon-button" type="button" data-action="engine-back" aria-label="Назад">${H.icon('back')}</button>`:''}<h1>${H.escape(title)}</h1><div class="pd-header-icons">${icons}</div></div></header><main class="pd-body" aria-label="${H.escape(title)}">${main}</main><footer class="pd-footer"><nav class="pd-nav" aria-label="Основные разделы">${[['bids','Заявки'],['acts','Акты'],['equipment','Приборы'],['guide','Справочник']].map(([key,label])=>`<button type="button" data-action="engine-nav" data-destination="${key}"${view.nav===key?' aria-current="page"':''}><span class="pd-nav-mark">${H.icon(key)}</span><span>${label}</span></button>`).join('')}</nav><div class="pd-gesture" aria-hidden="true"></div></footer><span class="pd-live" role="status">${s.engineAnnouncement?H.escape(s.engineAnnouncement):''}</span>${s.engineHelp?`<div class="pd-overlay"><section class="pd-overlay-panel pd-stack" role="dialog" aria-modal="true" aria-label="О гипотезе"><h2 class="pd-title">Что можно попробовать</h2><p>${H.escape(explanations[id])}</p><button class="pd-action" data-action="engine-close-help" type="button">Понятно</button></section></div>`:''}`;
    const body=phone.querySelector('.pd-body');
    if (!resetScroll) body.scrollTop=oldScroll;
    if (!page) view.afterRender?.(phone,s,persist);
    const dialog=phone.querySelector('[role="dialog"]');
    if (dialog) {
      phone.querySelector('.pd-header').setAttribute('inert','');
      phone.querySelector('.pd-footer').setAttribute('inert','');
      if(s.engineHelp) body.setAttribute('inert','');
      dialog.querySelector('input, select, button')?.focus?.({preventScroll:true});
    }
  }
  function restore(snapshot) {
    const saved=snapshot?.privateContent?.hypothesisStates;
    if(!saved||typeof saved!=='object')return;
    for(const id of Object.keys(states)) {
      const value=saved[id];
      if(!value||typeof value!=='object'||Array.isArray(value))continue;
      // Restore only fields belonging to the known demo-state contract.
      const allowed=new Set([...Object.keys(views[id].initial()),'enginePage','destinationTitle','engineHelp','engineAnnouncement']);
      for(const key of allowed)if(Object.hasOwn(value,key)) {
        const v=value[key];
        if(typeof v==='string'&&v.length<=2000||typeof v==='boolean'||typeof v==='number'||Array.isArray(v)&&v.length<=20||v===null||key==='receipt'&&typeof v==='object') states[id][key]=v;
      }
    }
    boxes.forEach(phone=>renderPhone(phone));
  }
  for (const phone of boxes) {
    phone.addEventListener('click',event=>{
      const el=event.target.closest('[data-action]');
      if(!el||el.disabled)return;
      const id=phone.dataset.view,s=states[id],name=el.dataset.action;
      let handled=true,resetScroll=false;
      if(name==='engine-help')s.engineHelp=true;
      else if(name==='engine-close-help')s.engineHelp=false;
      else if(name==='engine-resume'){s.enginePage='';resetScroll=true;}
      else if(name==='engine-back'){
        if(id==='entry'&&s.reviewOpen)views[id].action(s,'entry-cancel-review',el);
        else if(id==='entry'&&s.saved)views[id].action(s,'entry-continue',el);
        else if(id==='validation'&&s.editing)views[id].action(s,'validation-back',el);
        else {s.enginePage='acts';resetScroll=true;}
      }
      else if(name==='engine-nav'){
        const dest=el.dataset.destination;
        if(dest===views[id].nav){s.enginePage=dest==='acts'&&(id==='entry'||id==='validation')?'acts':'';}
        else {s.enginePage='destination';s.destinationTitle={bids:'Заявки',acts:'Акты',equipment:'Приборы',guide:'Справочник'}[dest];}
        resetScroll=true;
      }
      else if(name==='engine-profile'||name==='engine-notifications'){s.enginePage='destination';s.destinationTitle=name==='engine-profile'?'Профиль':'Уведомления';resetScroll=true;}
      else handled=views[id].action(s,name,el);
      if(handled){renderPhone(phone,resetScroll);persist();}
    });
    const update=event=>{
      const field=event.target.closest('[data-field]');
      if(!field)return;
      const s=states[phone.dataset.view],key=field.dataset.field;
      if(Object.hasOwn(s,key)&&typeof s[key]!=='object')s[key]=field.value;
      if(phone.dataset.view==='board'&&key==='filter'&&field.value!=='all')s.column=field.value;
      if(event.type==='change')renderPhone(phone);
      persist();
    };
    phone.addEventListener('input',update);
    phone.addEventListener('change',update);
    phone.addEventListener('keydown',event=>{
      const dialog=phone.querySelector('[role="dialog"]');
      if(!dialog)return;
      if(event.key==='Escape'){
        const s=states[phone.dataset.view];
        if(s.engineHelp)s.engineHelp=false; else if(phone.dataset.view==='agreement')views.agreement.action(s,'agree-cancel');
        event.preventDefault();renderPhone(phone);persist();return;
      }
      if(event.key==='Tab'){
        const fields=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),a[href]')];
        const first=fields[0],last=fields[fields.length-1];
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus?.();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus?.();}
      }
    });
    renderPhone(phone);
  }
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
})();


</script>
