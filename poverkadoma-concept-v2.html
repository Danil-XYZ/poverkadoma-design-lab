    repaint();setTimeout(()=>{for(const x of list)if(ids.includes(x.id)&&x.status==='sending'){x.status='sent';x.message='Сервер подтвердил получение акта. Публикация в Аршине ещё ожидается.';}S.uploadDone=!list.some(x=>['ready','error','queued','sending'].includes(x.status));S.upload.selected=[];repaint();toast('Получение актов подтверждено сервером.');},650);
  }

    if(path.startsWith('strain.')){S.strains.values??={};S.strains.values[path.slice(7)]=value;return;}
    const parts=path.split('.');let dest=S;for(let i=0;i<parts.length-1;i++){if(!dest[parts[i]]||typeof dest[parts[i]]!=='object')dest[parts[i]]={};dest=dest[parts[i]];}dest[parts.at(-1)]=value;

  }

      case 'save-settings':S.defaultsSaved=true;toast('Настройки сохранены.');return;
      case 'save-cash':case 'save-storage':case 'save-maintenance':case 'save-agent':toast(S.offline?'Сохранено на телефоне. Передача ожидает Интернет.':'Изменения сохранены.');return;
      case 'create-backup':modal('Копия подготовлена',pModal('2 акта · 18 фотографий<br>Копия от 23 октября, 09:41')+pModal('Выберите место, где файл сохранится независимо от приложения.'),action('Выбрать место сохранения','backup-done','download','primary full'));return;
      case 'backup-done':closeModal();toast('Копия сохранена. Теперь можно переносить данные.');return;

      case 'restore-done':closeModal();toast('Данные из копии восстановлены.');return;
      case 'logout':modal('Выйти из аккаунта?',pModal('На телефоне есть 2 неотправленных акта. Перед выходом сохраните копию данных.'),btn('Создать копию данных','backup','download','primary full')+action('Выйти, сохранив данные этого аккаунта','logout-confirm','log-out','secondary full'));return;
      case 'logout-confirm':closeModal();S.role='guest';S.screen='login';S.navStack=[];render();persist();return;
      case 'clear-notifications':S.notificationsRead=true;toast('Обычные уведомления очищены. Критические сохранены.');return;
      case 'login':if(!S.formValues['login.id']){modal('Введите идентификатор',pModal('Получите его у ответственного вашей лаборатории или зарегистрируйтесь по почте.'));return;}S.role='internal';S.screen=roles[S.role].start;render();persist();return;
      case 'recover-access':S.recover=true;navigate('register');return;
      case 'request-code':{const email=S.formValues['register.email']||'';if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){modal('Проверьте электронную почту',pModal('Укажите полный адрес, например name@example.ru.'));return;}navigate('verify');return;}
      case 'verify-code':{const code=S.formValues['register.code']||'';if(!/^\d{4}$/.test(code)){toast('Введите четыре цифры из письма.');return;}S.role='demo';S.screen=roles[S.role].start;S.navStack=[];render();persist();toast('Почта подтверждена. Открыт демонстрационный профиль.');return;}
      case 'resend-code':toast('Отправлен новый код. Он действует 5 минут.');return;
      case 'top-up':modal('Пополнить выгрузки',`<label class="field">Пакет<select><option>100 поверенных СИ</option><option>500 поверенных СИ</option></select></label><label class="field">Способ оплаты<select><option>Банковская карта</option><option>Счёт для организации</option></select></label>`,action('Перейти к оплате','payment-preview','external-link','primary full'));return;
      case 'payment-preview':modal('Подтверждение платежа',pModal('Перед оплатой в личном кабинете показываются стоимость пакета, комиссия и срок зачисления.'));return;
      case 'commission-info':modal('Как начисляется вознаграждение',pModal('200 ₽ за каждый фактически поверенный счётчик. Начисление появляется после выполнения заявки.')+pModal('Итог относится ко всему выбранному периоду, включая другие страницы списка.'));return;
      case 'crew-work':S.filter='all';navigate('bids');toast('Показаны заявки выбранного поверителя.');return;
      case 'scan-tag':case 'find-tag':navigate('equipment-detail');toast('Оборудование найдено по бирке.');return;
      case 'inactive-agents':modal('Неактивные агенты',pModal('Дмитрий Орлов<br>Создание новых заявок отключено. Ранее созданные заявки доступны для просмотра.'),btn('Открыть агента','agent','','secondary full'));return;
      case 'equipment-storage':modal('Перевести на хранение?',pModal('Оборудование не будет предлагаться для новых поверок. История сохранится.'),action('Подтвердить перевод','equipment-stored','archive','primary full'));return;
      case 'equipment-stored':closeModal();toast('Оборудование переведено на хранение.');return;
      case 'organization':modal('Организация и доступ',field('Лаборатория','organization.name',S.role==='demo'?'Демонстрационная':'МС-Ресурс')+(S.role==='demo'?'':kv('Идентификатор','МС-000000'))+pModal('Доступные организации и права определяются вашим профилем. Изменение проверяется сервером.'),action('Проверить и сохранить','organization-save','check','primary full')+action('Сменить аккаунт','logout','','text-button full'));return;
      case 'organization-save':closeModal();toast('Данные организации сохранены.');return;
      case 'agent-access':modal('Данные для входа агента',kv('Идентификатор','АГ-000000')+pModal('Агент может восстановить доступ через вас или через указанную почту.'),action('Скопировать идентификатор','copy-id','copy','primary full'));return;
      case 'copy-id':toast('Идентификатор подготовлен для копирования.');return;
      case 'cabinet':modal('Личный кабинет',pModal('Откроется кабинет текущего пользователя с актами, поверками, заявками и профилем. Повторный ввод идентификатора не требуется.'));return;
      case 'message-thread':modal('Вопрос по отправке акта',pModal('<b>Вы:</b> После отправки долго показывалась загрузка.')+pModal('<b>Поддержка:</b> Откройте историю. Если акт уже получен сервером, отправлять его снова не нужно.'),btn('Ответить','compose','reply','primary full'));return;
      case 'send-message':if(!(S.formValues['support.text']||'').trim()&&!S.photoAdded){toast('Добавьте сообщение или вложение.');return;}navigate('messages');toast(S.offline?'Сообщение сохранено. Ожидает отправки.':'Сообщение отправлено в поддержку.');return;
      case 'use-arshin':S.meter.serial='24068513';navigate('meter');toast('Данные перенесены. Проверьте их перед сохранением.');return;
      case 'document-preview':case 'type-document':case 'method-document':modal(a==='method-document'?'Методика поверки':'Просмотр документа',pModal('Документ открывается с увеличением текста и поиском по содержимому.'),action('Сохранить копию документа','document-download','download','secondary full'));return;
      case 'document-download':toast('Выбран документ для сохранения на устройстве.');return;
      case 'check-update':toast('Проверка завершена. Установлена актуальная версия.');return;
      case 'equipment-history':case 'storage-history':modal('История записей',kv('22 октября','Проверка пройдена')+kv('21 октября','Запись подтверждена')+kv('20 октября','Запись подтверждена'));return;
      case 'receipts':modal('Кассовые чеки',kv('Акт № 002418','1 600 ₽ · подготовлен')+kv('Акт № 002417','800 ₽ · оплачен'));return;
      case 'payment-history':modal('История платежей',kv('15 октября','Пакет 100 выгрузок · зачислено')+kv('1 октября','Пакет 100 выгрузок · зачислено'));return;
      case 'billing-info':modal('Оплата сервиса',pModal('Пакет используется всей лабораторией. Одна выгрузка списывается за один счётчик при приёме результатов сервером.'));return;
      case 'release-history':modal('История версий',pModal('3.13.0 — работа с актами, фотографиями и отправкой.')+pModal('Полный список изменений доступен в новостях приложения.'));return;
      case 'help-start':modal('Начало работы',pModal('Откройте заявку или создайте акт. Добавьте счётчики, выполните измерения и проверьте данные. Сохранённый акт можно отправить сразу или позже.'),btn('К актам','acts','','primary full'));return;
      case 'help-upload':modal('Если акт не отправляется',pModal('Откройте «Отправка актов». Рядом с актом указана причина и действие для исправления. Сам акт и фотографии остаются на телефоне.'),btn('Проверить отправки','upload','','primary full'));return;
      case 'help-nepton':navigate('nepton');return;
      case 'help-access':modal('Доступ к приложению',pModal('Идентификатор выдаёт лаборатория. Если указана электронная почта, доступ можно восстановить кодом из письма. Агент без почты обращается к создавшему его поверителю.'),btn('Вернуться ко входу','login','','primary full'));return;
      default:toast('Действие выбрано.');
    }
  }
  root.addEventListener('click',e=>{
    const el=e.target.closest('button,[data-view]');if(!el||!root.contains(el)||el.disabled)return;
    if(el.dataset.view){S.view=el.dataset.view;render();persist();return;}
    if(el.dataset.roleNav){S.role=el.dataset.roleNav;S.navStack=[];navigate(el.dataset.screen,'',true);return;}
    if(el.dataset.nav){closeModal();navigate(el.dataset.nav,el.dataset.id||'');return;}
    if(el.dataset.action)handle(el.dataset.action,el.dataset.id||'',el);
  });
  root.addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.bind)S.formValues[el.dataset.bind]=el.value;
    if(el.dataset.action==='form-field')writeField(el.dataset.id,el.type==='checkbox'?el.checked:el.value);
    if(el.dataset.search==='bids'){S.search=el.value;const caret=el.selectionStart;repaint();const inp=root.querySelector('[data-search="bids"]');inp.focus();inp.setSelectionRange(caret,caret);}
  });
  root.addEventListener('change',e=>{
    const el=e.target;
    if(el.hasAttribute('data-preview-role')){closeModal();S.role=el.value;S.bidId='17658';S.bidRecords={};S.bidStatus=['agent','dispatcher'].includes(S.role)?'Новая':'Согласована';S.cancelled=false;S.assigned=false;titles.bid='Заявка № 17658';S.filter=['agent','dispatcher'].includes(S.role)?'all':'today';S.screen=roles[S.role].start;S.navStack=[];S.search='';S.view='prototype';render();persist();return;}
    if(el.hasAttribute('data-preview-screen')){navigate(el.value);return;}
    if(el.hasAttribute('data-preview-state')){closeModal();S.offline=el.value==='offline';S.readDoc=el.value!=='document';repaint();if(!S.offline&&S.upload.queueEnabled){const ids=uploadItems().filter(x=>x.status==='queued').map(x=>x.id);if(ids.length)sendUploads(ids);}return;}
    if(el.dataset.action==='toggle-large'){S.large=el.checked;repaint();return;}
    if(el.dataset.action==='theme'){S.theme=el.value;repaint();return;}
    if(el.dataset.action==='form-field'){writeField(el.dataset.id,el.type==='checkbox'?el.checked:el.value);if(el.tagName==='SELECT'||el.type==='checkbox')repaint();return;}
    if(el.dataset.action==='upload-select'){const old=S.upload.selected||pendingIds();S.upload.selected=el.checked?[...new Set([...old,el.dataset.id])]:old.filter(x=>x!==el.dataset.id);repaint();}
  });
  root.addEventListener('keydown',e=>{
    const dialog=root.querySelector('[role="dialog"]');if(!dialog)return;
    if(e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(e.key==='Tab'){const q=[...dialog.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled),first=q[0],last=q.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  });
  const saved=window.openai?.widgetState?.privateContent;
  if(saved?.revision==='v2'&&roles[saved.role]){for(const key of ['role','large','offline','theme'])if(saved[key]!==undefined)S[key]=saved[key];if(titles[saved.screen])S.screen=saved.screen;}
  window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(!localEdits&&p?.revision==='v2'&&p.session!==previewSession&&roles[p.role]){S.role=p.role;S.screen=titles[p.screen]?p.screen:roles[p.role].start;S.large=!!p.large;S.offline=!!p.offline;S.theme=p.theme||'auto';render();}});
  uploadItems();
  render();
  window.addEventListener('load',refreshIcons,{once:true});
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root.querySelector('.pd-phone'),onChange:()=>{if(!S.offline&&S.upload.queueEnabled){const ids=uploadItems().filter(x=>x.status==='queued').map(x=>x.id);if(ids.length){sendUploads(ids);return;}}repaint();}});
    tweak.addToggle(S,'large',{label:'Крупный текст',reference:'pd.font.large'});
    tweak.addSelect(S,'theme',{label:'Тема',options:[{label:'Как на устройстве',value:'auto'},{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}],reference:'pd.appearance'});
  }
  window.PD_CONCEPT={state:S,navigate,render,roles,screenNames:titles};
})();

</script>
