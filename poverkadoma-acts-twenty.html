  function closeDialog(){if(!activeDialog)return;const {node,trigger}=activeDialog;activeDialog=null;node.remove();trigger?.focus?.();}
  function dialog(key,title,message,actions=[{label:'Понятно',kind:'primary',run:closeDialog}],content){closeDialog();const phone=root.querySelector('[data-design="'+key+'"] .ax-phone'),overlay=el('div','ax-overlay'),panel=el('section','ax-dialog');panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');const heading=el('h3','',title);heading.id='ax-dialog-title-'+key;panel.setAttribute('aria-labelledby',heading.id);panel.append(heading);if(message)panel.append(el('p','',message));if(content)panel.append(content);const buttons=el('div','ax-dialog-actions');for(const action of actions)buttons.append(button(action.label,action.run,action.kind||'secondary'));panel.append(buttons);overlay.append(panel);activeDialog={node:overlay,trigger:document.activeElement};phone.append(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog();});overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const all=[...panel.querySelectorAll('button,input,select,textarea')].filter(n=>!n.disabled),first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus?.();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus?.();}}});buttons.querySelector('button')?.focus?.();paintIcons();return panel;}
  function confirmUpload(key,items){const ready=items.filter(a=>a.status==='ready');if(!ready.length){dialog(key,'Готовых актов нет','Откройте черновик и заполните данные всех счётчиков.');return;}const listing=el('ul','ax-dialog-list');for(const act of ready){const n=el('li');n.append(el('strong','',act.number),el('span','',act.address));listing.append(n);}const other=acts(key).filter(a=>a.status!=='ready'&&a.status!=='sent').length;dialog(key,ready.length===1?'Выгрузить акт?':'Выгрузить готовые акты?',ready.length+' '+(ready.length===1?'акт':'акта')+' будут выгружены в учебном примере.'+(items.length>1&&other?' Черновики и акты с ошибкой останутся на устройстве.':''),[{label:'Отмена',run:closeDialog},{label:ready.length===1?'Выгрузить':'Выгрузить всё',kind:'primary',run:()=>{closeDialog();for(const act of ready)act.status='sent';const s=state(key);s.notifications.push('Выгружено актов: '+ready.length);s.route='acts';render(key);dialog(key,'Готово','Учебная выгрузка завершена. Акты доступны в истории.',[{label:'К актам',run:closeDialog},{label:'История',run:()=>{closeDialog();s.route='history';s.historyTab='history';render(key);}}]);}}],listing);}
  function settings(key){const form=el('div','ax-form'),theme=formField('Тема',preferences.theme,()=>{},'select'),select=theme.querySelector('select');for(const [value,name]of [['light','Светлая'],['dark','Тёмная']]){const option=el('option','',name);option.value=value;if(value===preferences.theme)option.selected=true;select.append(option);}select.value=preferences.theme;select.addEventListener('change',()=>{preferences.theme=select.value;applyTheme();save();});const hint=el('label','ax-field'),check=el('input');check.type='checkbox';check.checked=state(key).hints;check.style.width='24px';check.style.height='24px';check.addEventListener('change',()=>state(key).hints=check.checked);hint.append(el('span','','Подсказки на экранах'),check);form.append(theme,hint);dialog(key,'Настройки','',[{label:'Готово',kind:'primary',run:()=>{closeDialog();render(key);}}],form);}
  function announce(text){root.querySelector('.ax-live').textContent=text;}
  function applyTheme(){root.dataset.theme=preferences.theme;root.style.setProperty('--ax-width',preferences.width+'px');}
  function save(){window.openai?.setWidgetState?.({modelContent:{subject:'Поверка дома — двадцать вариантов Актов',liked:preferences.liked.map(key=>names.get(key)),theme:preferences.theme,longData:preferences.longData,empty:preferences.empty},privateContent:{actsTwenty:{...preferences}}})?.catch?.(()=>{});}
  function restore(value){const p=value?.privateContent?.actsTwenty;if(!p)return;preferences.theme=p.theme==='dark'?'dark':'light';preferences.width=Number.isFinite(p.width)?Math.max(320,Math.min(430,p.width)):390;preferences.longData=p.longData===true;preferences.empty=p.empty===true;preferences.liked=Array.isArray(p.liked)?p.liked.filter(key=>names.has(key)):[];applyTheme();for(const key of keys)render(key);}
  function renderAll(){closeDialog();applyTheme();for(const key of keys)render(key);}
  restore(window.openai?.widgetState);renderAll();window.addEventListener('openai:set_globals',e=>{if(JSON.stringify(e.detail?.globals?.widgetState?.privateContent?.actsTwenty)===JSON.stringify(preferences))return;restore(e.detail?.globals?.widgetState);});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{renderAll();save();}});tweak.addSelect(preferences,'theme',{label:'Тема',options:[{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}]});tweak.addSlider(preferences,'width',{label:'Ширина макета',min:320,max:430,step:1,unit:'px'});tweak.addToggle(preferences,'longData',{label:'Длинные данные'});tweak.addToggle(preferences,'empty',{label:'Пустой список'});}
})();
</script>
