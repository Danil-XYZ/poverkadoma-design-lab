  <style>
    #pd-act-card-layouts { --cx-bg:light-dark(#F2F4F9,#181818); --cx-surface:light-dark(#FFFFFF,#242424); --cx-field:light-dark(#E9ECF2,#343434); --cx-ink:light-dark(#181818,#FFFFFF); --cx-muted:light-dark(#616264,#C6C6C6); --cx-line:light-dark(#CCCCCC,#616264); --cx-blue:#0084C1; --cx-white:#FFFFFF; --cx-green:#43BE83; --cx-red:#D96161; --cx-amber:#FFB21C; --cx-scale:1; color-scheme:light dark; font-family:"Segoe UI",sans-serif; color:var(--cx-ink); position:relative; }
    #pd-act-card-layouts[data-appearance="light"] { color-scheme:light; }
    #pd-act-card-layouts[data-appearance="dark"] { color-scheme:dark; }
    #pd-act-card-layouts .cx-controls, #pd-act-card-layouts .cx-stage, #pd-act-card-layouts .cx-dialog { box-sizing:border-box; }
    #pd-act-card-layouts .cx-controls *, #pd-act-card-layouts .cx-stage *, #pd-act-card-layouts .cx-dialog * { box-sizing:border-box; }
    #pd-act-card-layouts .cx-controls { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
    #pd-act-card-layouts .cx-controls label { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:14px; line-height:20px; }
    #pd-act-card-layouts .cx-controls select { min-height:44px; max-width:100%; padding:8px 12px; border:1px solid var(--cx-line); border-radius:12px; background:var(--cx-surface); color:var(--cx-ink); font:16px/24px "Segoe UI",sans-serif; }
    #pd-act-card-layouts .cx-stage { display:flex; justify-content:center; align-items:flex-start; width:100%; min-height:360px; padding:12px 0; }
    #pd-act-card-layouts[data-long="true"] .cx-stage { min-height:620px; }
    #pd-act-card-layouts[data-large="true"] .cx-stage { min-height:680px; }
    #pd-act-card-layouts[data-long="true"][data-large="true"] .cx-stage { min-height:1000px; }
    #pd-act-card-layouts .cx-product { width:100%; max-width:var(--cx-width,390px); padding:16px; border-radius:24px; background:var(--cx-bg); font-size:calc(16px * var(--cx-scale)); line-height:1.5; }
    #pd-act-card-layouts .cx-card { position:relative; isolation:isolate; display:flex; flex-direction:column; gap:8px; min-width:0; padding:12px; border:1px solid var(--cx-line); border-radius:22px; background:var(--cx-surface); box-shadow:0 4px 14px #18181820,0 1px 3px #18181810; }
    #pd-act-card-layouts .cx-card p { margin:0; }
    #pd-act-card-layouts .cx-header { display:flex; flex-direction:column; gap:4px; min-width:0; }
    #pd-act-card-layouts .cx-number { min-width:0; color:var(--cx-ink); font-size:calc(17px * var(--cx-scale)); line-height:1.3; font-weight:700; overflow-wrap:anywhere; }
    #pd-act-card-layouts .cx-address { min-width:0; color:var(--cx-muted); font-size:calc(14px * var(--cx-scale)); line-height:calc(20px * var(--cx-scale)); font-weight:400; overflow-wrap:anywhere; }
    #pd-act-card-layouts .cx-date { flex:0 0 auto; color:var(--cx-muted); font-size:calc(14px * var(--cx-scale)); line-height:calc(20px * var(--cx-scale)); font-weight:400; white-space:nowrap; }
    #pd-act-card-layouts .cx-row { display:flex; align-items:center; justify-content:space-between; gap:4px 8px; min-width:0; }
    #pd-act-card-layouts .cx-column { display:flex; flex-direction:column; gap:4px; min-width:0; }
    #pd-act-card-layouts .cx-tail { display:flex; align-items:center; flex:0 0 auto; gap:4px; min-width:0; }
    #pd-act-card-layouts .cx-status { --cx-status:var(--cx-green); display:inline-flex; align-items:center; gap:4px; max-width:100%; padding:2px 8px; border-radius:6px; color:var(--cx-ink); background:color-mix(in srgb,var(--cx-status) 16%,var(--cx-surface)); font-size:calc(13px * var(--cx-scale)); line-height:calc(20px * var(--cx-scale)); font-weight:400; white-space:nowrap; }
    #pd-act-card-layouts .cx-status::before { content:""; width:8px; height:8px; flex:0 0 8px; border-radius:50%; background:var(--cx-status); }
    #pd-act-card-layouts .cx-card[data-state="draft"] .cx-status { --cx-status:var(--cx-amber); }
    #pd-act-card-layouts .cx-card[data-state="error"] .cx-status { --cx-status:var(--cx-red); }
    #pd-act-card-layouts .cx-icon { position:relative; display:inline-flex; align-items:center; justify-content:center; flex:0 0 16px; width:16px; height:20px; color:inherit; }
    #pd-act-card-layouts .cx-icon svg { width:16px; height:16px; stroke-width:1.7; }
    #pd-act-card-layouts .cx-head-row .cx-row { gap:8px; }
    #pd-act-card-layouts .cx-head-row .cx-row:last-child { align-items:center; }
    #pd-act-card-layouts .cx-head-row .cx-address { flex:1; }
    #pd-act-card-layouts .cx-head-row .cx-number { flex:0 1 auto; }
    #pd-act-card-layouts .cx-head-balanced .cx-row:first-child { align-items:center; }
    #pd-act-card-layouts .cx-head-balanced .cx-row:last-child { align-items:baseline; }
    #pd-act-card-layouts .cx-head-balanced .cx-address { flex:1; }
    #pd-act-card-layouts .cx-head-blocks .cx-header { display:grid; grid-template-columns:minmax(0,1fr) max-content; gap:8px; align-items:start; }
    #pd-act-card-layouts .cx-head-blocks .cx-column:last-child { align-items:flex-end; }
    #pd-act-card-layouts .cx-head-footer .cx-header > .cx-row { align-items:baseline; }
    #pd-act-card-layouts .cx-head-address .cx-address { order:-1; }
    #pd-act-card-layouts .cx-head-address .cx-row { gap:8px; }
    #pd-act-card-layouts .cx-head-address .cx-row:last-child { justify-content:flex-end; }
    #pd-act-card-layouts .cx-head-address .cx-number { flex:0 1 auto; }
    #pd-act-card-layouts .cx-meters { display:flex; flex-direction:column; gap:8px; min-width:0; padding-top:8px; border-top:1px solid var(--cx-line); }
    #pd-act-card-layouts .cx-meter { display:grid; grid-template-columns:40px minmax(0,1fr); gap:8px; align-items:center; min-width:0; }
    #pd-act-card-layouts .cx-meter + .cx-meter { border-top:1px solid var(--cx-line); padding-top:8px; }
    #pd-act-card-layouts .cx-photo { display:grid; place-items:center; width:40px; height:40px; overflow:hidden; border-radius:8px; background:var(--cx-field); color:var(--cx-red); }
    #pd-act-card-layouts .cx-photo[data-missing="true"] { background:color-mix(in srgb,var(--cx-red) 16%,var(--cx-surface)); }
    #pd-act-card-layouts .cx-photo .cx-icon { width:24px; height:24px; flex-basis:24px; }
    #pd-act-card-layouts .cx-photo svg { width:20px; height:20px; }
    #pd-act-card-layouts .cx-photo img { display:block; width:100%; height:100%; object-fit:cover; }
    #pd-act-card-layouts .cx-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-areas:"type serial" "reg method"; align-items:baseline; gap:0 8px; min-width:0; }
    #pd-act-card-layouts .cx-value { display:block; min-width:0; color:var(--cx-muted); font-size:calc(14px * var(--cx-scale)); line-height:calc(20px * var(--cx-scale)); font-weight:400; overflow-wrap:anywhere; }
    #pd-act-card-layouts .cx-value[data-field="type"] { grid-area:type; color:var(--cx-ink); font-weight:600; }
    #pd-act-card-layouts .cx-value[data-field="serial"] { grid-area:serial; }
    #pd-act-card-layouts .cx-value[data-field="reg"] { grid-area:reg; }
    #pd-act-card-layouts .cx-value[data-field="method"] { grid-area:method; }
    #pd-act-card-layouts .cx-value[data-empty="true"] { color:var(--cx-red); }
    #pd-act-card-layouts .cx-meter-family .cx-fields { grid-template-areas:"type serial" "method reg"; }
    #pd-act-card-layouts .cx-meter-family .cx-value[data-field="serial"], #pd-act-card-layouts .cx-meter-family .cx-value[data-field="reg"] { text-align:right; }
    #pd-act-card-layouts .cx-meter-lines .cx-fields { display:flex; flex-direction:column; gap:0; }
    #pd-act-card-layouts .cx-value-line { display:flex; align-items:baseline; flex-wrap:wrap; gap:0 8px; min-width:0; }
    #pd-act-card-layouts .cx-meter-right .cx-meter { grid-template-columns:minmax(0,1fr) 40px; }
    #pd-act-card-layouts .cx-meter-right .cx-fields { grid-template-areas:"type method" "serial reg"; }
    #pd-act-card-layouts .cx-meter-right .cx-value[data-field="method"], #pd-act-card-layouts .cx-meter-right .cx-value[data-field="reg"] { text-align:right; }
    #pd-act-card-layouts .cx-entry { position:absolute; inset:0; z-index:1; width:100%; border:0; border-radius:inherit; padding:0; background:transparent; }
    #pd-act-card-layouts .cx-entry:focus-visible { outline:2px solid var(--cx-ink); outline-offset:2px; }
    #pd-act-card-layouts .cx-entry:active { background:color-mix(in srgb,var(--cx-field) 20%,transparent); }
    #pd-act-card-layouts .cx-button { position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-width:0; min-height:48px; padding:12px; border:0; border-radius:14px; color:var(--cx-white); background:var(--cx-blue); font:600 calc(16px * var(--cx-scale))/calc(24px * var(--cx-scale)) "Segoe UI",sans-serif; text-align:center; overflow-wrap:anywhere; }
    #pd-act-card-layouts .cx-button:active { filter:brightness(.94); }
    #pd-act-card-layouts .cx-secondary { border:1px solid var(--cx-line); color:var(--cx-blue); background:var(--cx-surface); }
    #pd-act-card-layouts .cx-footer { display:flex; align-items:center; flex-wrap:wrap; gap:8px; min-width:0; }
    #pd-act-card-layouts .cx-footer .cx-button { flex:1 1 120px; width:auto; }
    #pd-act-card-layouts .cx-preview { display:grid; min-width:0; }
    #pd-act-card-layouts .cx-carousel-wrap, #pd-act-card-layouts .cx-overlay { grid-area:1/1; min-width:0; }
    #pd-act-card-layouts .cx-overlay { position:relative; z-index:10; display:flex; align-items:flex-start; justify-content:center; padding:12px; border-radius:16px; background:#18181866; }
    #pd-act-card-layouts .cx-overlay[hidden] { display:none; }
    #pd-act-card-layouts .cx-dialog { display:flex; flex-direction:column; gap:12px; width:100%; max-width:430px; padding:16px; border-radius:22px; background:var(--cx-surface); box-shadow:0 12px 32px #18181830; color:var(--cx-ink); font:16px/24px "Segoe UI",sans-serif; }
    #pd-act-card-layouts .cx-dialog-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    #pd-act-card-layouts .cx-dialog h2 { margin:0; font-size:20px; line-height:28px; font-weight:600; }
    #pd-act-card-layouts .cx-dialog h3 { margin:0; font-size:16px; line-height:24px; font-weight:600; }
    #pd-act-card-layouts .cx-close { display:grid; place-items:center; flex:0 0 44px; width:44px; height:44px; padding:0; border:0; border-radius:12px; background:var(--cx-field); color:var(--cx-ink); }
    #pd-act-card-layouts .cx-dialog-body { display:flex; flex-direction:column; gap:12px; }
    #pd-act-card-layouts .cx-field { display:flex; flex-direction:column; gap:4px; min-width:0; font-size:14px; line-height:20px; }
    #pd-act-card-layouts .cx-field input { width:100%; min-width:0; min-height:48px; padding:10px 12px; border:1px solid var(--cx-line); border-radius:12px; background:var(--cx-surface); color:var(--cx-ink); font:16px/24px "Segoe UI",sans-serif; }
    #pd-act-card-layouts .cx-meter-editor { display:flex; flex-direction:column; gap:8px; padding-top:8px; border-top:1px solid var(--cx-line); }
    #pd-act-card-layouts .cx-note { margin:0; color:var(--cx-muted); font-size:14px; line-height:20px; }
    #pd-act-card-layouts .cx-dialog-actions { display:flex; flex-wrap:wrap; gap:8px; }
    #pd-act-card-layouts .cx-dialog-actions .cx-button { flex:1 1 120px; }
    #pd-act-card-layouts[data-large="true"] .cx-row { flex-wrap:wrap; gap:4px 8px; }
    #pd-act-card-layouts[data-large="true"] .cx-head-blocks .cx-header { grid-template-columns:minmax(0,1fr); }
    #pd-act-card-layouts[data-large="true"] .cx-head-blocks .cx-column:last-child { flex-direction:row; flex-wrap:wrap; align-items:center; justify-content:space-between; }

    if(globalThis.Tweak){let oldCount=prefs.meterCount;const t=new Tweak({container:root,onChange:()=>{if(oldCount!==prefs.meterCount){states=new Map();oldCount=prefs.meterCount;}renderAll();persist();}});t.addSelect(prefs,'appearance',{label:'Тема',options:[{value:'light',label:'Светлая'},{value:'dark',label:'Тёмная'},{value:'auto',label:'Системная'}]});t.addSelect(prefs,'width',{label:'Ширина',options:[{value:'320',label:'320 px'},{value:'360',label:'360 px'},{value:'390',label:'390 px'},{value:'430',label:'430 px'}]});t.addSelect(prefs,'meterCount',{label:'Счётчиков в акте',options:[{value:'1',label:'Один'},{value:'2',label:'Два'},{value:'3',label:'Три'}]});t.addToggle(prefs,'largeText',{label:'Увеличенный текст'});t.addToggle(prefs,'longData',{label:'Длинные данные'});}
    root.actCompositions={getConfig:()=>Object.fromEntries(config),getState:key=>clone(get(key)),getPreferences:()=>({...prefs}),setExample,renderAll,issues:key=>issues(get(key)),close};
  })();
  </script>
