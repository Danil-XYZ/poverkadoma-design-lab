  <script>
  (()=>{
    const root=document.getElementById('pd-act-card-layouts');
    const sections=[...root.querySelectorAll('[data-layout]')];
    const config={
      familiar:{head:'classic',meter:'compact',separator:'rule',notice:'under',photo:'line'},
      address:{head:'address',meter:'split',separator:'well',notice:'under',photo:'chip'},
      passport:{head:'passport',meter:'ledger',separator:'space',notice:'footer',photo:'line'},
      well:{head:'classic',meter:'split',separator:'bleed',notice:'under',photo:'chip'},
      boxes:{head:'address',meter:'boxed',separator:'space',notice:'footer',photo:'line'},
      rows:{head:'classic',meter:'split',separator:'rule',notice:'footer',photo:'end'},
      columns:{head:'classic',meter:'grid',separator:'caption',notice:'under',photo:'chip'},
      bottom:{head:'classic',meter:'compact',separator:'rule',notice:'footer',photo:'line',status:'footer'},
      table:{head:'address',meter:'table',separator:'rule',notice:'under',photo:'line'},
      number:{head:'number',meter:'numbered',separator:'caption',notice:'footer',photo:'line'},
      inline:{head:'inline',meter:'split',separator:'rule',notice:'under',photo:'chip'},
      spaces:{head:'address',meter:'compact',separator:'space',notice:'footer',photo:'line',noRowLines:true},
      outline:{head:'classic',meter:'compact',separator:'outline',notice:'under',photo:'chip'},
      caption:{head:'classic',meter:'numbered',separator:'caption',notice:'footer',photo:'line'},
      serial:{head:'address',meter:'serial',separator:'rule',notice:'under',photo:'end'},
      tinted:{head:'tinted',meter:'split',separator:'space',notice:'under',photo:'chip'},
      datefoot:{head:'address',meter:'compact',separator:'well',notice:'footer',photo:'line',date:'footer'},
      ticket:{head:'ticket',meter:'ledger',separator:'dashed',notice:'footer',photo:'stamp'},
      problem:{head:'classic',meter:'split',separator:'well',notice:'first',photo:'chip',band:true},
      checks:{head:'calendar',meter:'checks',separator:'caption',notice:'footer',photo:'stamp',status:'footer'}
    };
    const prefs={appearance:'light',width:'390',largeText:false,longData:false};
    let example='both',states=new Map(),returnFocus=null,activeKey='';
    const el=(tag,cls='',value)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n;};
    const icon=name=>{const n=el('span','ac-icon'),i=el('i');i.dataset.lucide=name;i.setAttribute('aria-hidden','true');n.setAttribute('aria-hidden','true');n.append(i);return n;};
    const paintIcons=()=>globalThis.lucide?.createIcons?.({attrs:{width:16,height:16,'stroke-width':1.7}});
    const clone=v=>JSON.parse(JSON.stringify(v));
    function seed(){const a={number:'23-2026-00018',date:'2026-11-02',address:'Тольятти, ул. Строителей, 18, кв. 24',owner:'Ирина Викторовна Орлова',sendError:false,sent:false,meters:[{reg:'37523-08',type:'СГВ-15',serial:'24010518',method:'МП-01 · учебный пример',photo:'Счётчик-1.jpg'},{reg:'37523-08',type:'СХВ-15',serial:'24010519',method:'МП-01 · учебный пример',photo:'Счётчик-2.jpg'}]};if(['global','both'].includes(example))a.owner='';if(['photo','both'].includes(example))a.meters[1].photo='';if(example==='meter')a.meters[1].method='';if(example==='error')a.sendError=true;return a;}
    const get=key=>{if(!states.has(key))states.set(key,seed());return states.get(key);};
    const issues=a=>[...(!a.owner.trim()?[{scope:'act',field:'owner',text:'Не указан владелец'}]:[]),...(!a.address.trim()?[{scope:'act',field:'address',text:'Не указан адрес'}]:[]),...a.meters.flatMap((m,index)=>[...(!m.photo?[{scope:'meter',index,field:'photo',text:'Нет фото'}]:[]),...['reg','type','serial','method'].filter(f=>!m[f].trim()).map(field=>({scope:'meter',index,field,text:{reg:'Не указан рег. номер',type:'Не выбран тип СИ',serial:'Нет заводского номера',method:'Не выбрана методика'}[field]}))])];
    const status=a=>a.sent?'sent':a.sendError?'error':issues(a).length?'draft':'ready';
    const statusName={ready:'Готов к выгрузке',draft:'Черновик',error:'Не выгружен',sent:'Выгружен'};
    function statusLabel(a){const n=el('span','ac-status',status(a)==='ready'?'Готов':statusName[status(a)]);n.setAttribute('aria-label','Статус: '+statusName[status(a)]);return n;}
    function dateLabel(a){const n=el('span','ac-date',a.date.split('-').reverse().join('.'));n.setAttribute('aria-label','Дата работ: '+n.textContent);return n;}
    function warning(text,{tone='warning',glyph='triangle-alert',cls=''}={}){const n=el('div','ac-warning '+cls);n.dataset.tone=tone;n.append(icon(glyph),el('span','ac-warning-text',text));return n;}
    function actNotice(a,c){const all=issues(a).filter(i=>i.scope==='act');if(!all.length&&!a.sendError)return null;const n=el('div','ac-notice');n.dataset.presentation=a.sendError?'error':c.band?'band':c.notice==='footer'?'chips':'plain';for(const item of all)n.append(warning(item.text));if(a.sendError)n.append(warning('Нет интернета. Акт сохранён.',{tone:'error',glyph:'cloud-off'}));return n;}
    function fieldValue(m,field){if(field==='type'&&prefs.longData)return (m[field]||'Тип СИ не выбран')+' — учебный счётчик с длинным названием';if(field==='method'&&m[field]&&prefs.longData)return m[field]+', расширенная редакция для проверки переноса строк';return m[field]||{reg:'Не указан',type:'Тип СИ не выбран',serial:'Не указан',method:'Не выбрана'}[field];}
    function meter(a,m,index,c){
      const row=el('div','ac-meter');row.dataset.meterIndex=String(index);row.setAttribute('aria-label','Счётчик '+(index+1));
      const local=issues(a).filter(i=>i.scope==='meter'&&i.index===index),fields=el('div','ac-fields');
      for(const [field,label]of [['reg','Рег. '],['type',''],['serial','Зав. '],['method','МП: ']]){
        const item=el('span','ac-field');item.dataset.field=field;
        if(field==='type'&&c.meter==='numbered')item.append(el('span','ac-inline-index',String(index+1)));
        item.append(el('span','ac-field-label',label),el('span',m[field]?'':'ac-missing-value',fieldValue(m,field)));
        if(field==='type'&&c.meter==='checks'&&!local.length){const check=el('span','ac-meter-check');check.setAttribute('aria-label','Счётчик заполнен');check.append(icon('circle-check'));item.append(check);}
        if(field==='serial'&&!m.photo){const note=el('span','ac-warning ac-photo-warning');note.dataset.presentation=c.photo;note.dataset.missingPhoto=String(index+1);note.setAttribute('aria-label','Счётчик '+(index+1)+': нет фото');note.append(icon('camera-off'),el('span','ac-warning-text','Нет фото'));item.append(note);}
        fields.append(item);
      }
      row.append(fields);if(c.noRowLines&&index>0){row.style.borderTop='0';row.style.paddingTop='4px';}return row;
    }
    function meterArea(a,c){const area=el('section','ac-meter-area');area.setAttribute('aria-label','Счётчики акта');if(['caption','outline'].includes(c.separator))area.append(el('div','ac-meter-heading','Счётчики'));const list=el('div','ac-meters');a.meters.forEach((m,i)=>list.append(meter(a,m,i,c)));area.append(list);return area;}
    function action(label,fn,secondary=false){const b=el('button','ac-button cursor-interaction'+(secondary?' ac-button-secondary':''),label);b.type='button';b.addEventListener('click',fn);return b;}
    function render(key){
      const section=sections.find(n=>n.dataset.layout===key),product=section.querySelector('.ac-product'),c=config[key],a=get(key),card=el('article','ac-card ac-head-'+c.head+' ac-meter-mode-'+c.meter+' ac-separator-'+c.separator);
      card.dataset.status=status(a);card.dataset.actCard=key;
      const head=el('div','ac-head'),top=el('div','ac-top'),chevron=icon('chevron-right');chevron.classList.add('ac-chevron');
      if(c.head==='calendar')top.append(dateLabel(a));
      top.append(el('span','ac-number',a.number));
      if(c.date!=='footer'&&c.head!=='calendar')top.append(dateLabel(a));
      if(c.status!=='footer')top.append(statusLabel(a));
      top.append(chevron);head.append(top,el('p','ac-address',prefs.longData?'Тольятти, ул. Александра Сергеевича Пушкина, 123, корп. 2, кв. 124':a.address||'Адрес не указан'));
      const notice=actNotice(a,c);card.append(head);if(notice&&c.notice!=='footer')card.append(notice);card.append(meterArea(a,c));
      const foot=el('div',c.status==='footer'?'ac-status-summary':'ac-footer');
      if(notice&&c.notice==='footer')foot.append(notice);
      if(c.date==='footer')foot.append(dateLabel(a));
      if(c.status==='footer')foot.append(statusLabel(a));
      const open=el('button','ac-entry cursor-interaction');open.type='button';open.setAttribute('aria-label','Открыть акт '+a.number+'. '+statusName[status(a)]+'. '+a.address);open.dataset.openCard=key;open.addEventListener('click',()=>openEditor(key,open));card.append(open);
      if(!issues(a).length&&!a.sent){const send=action(a.sendError?'Повторить выгрузку':'Выгрузить',()=>confirmUpload(key));send.dataset.upload=key;if(foot.childNodes.length)foot.append(send);else card.append(send);}
      if(foot.childNodes.length)card.append(foot);
      product.replaceChildren(card);paintIcons();
    }
    function renderAll(){root.dataset.appearance=prefs.appearance;root.dataset.large=String(prefs.largeText);root.dataset.long=String(prefs.longData);root.style.setProperty('--ac-scale',prefs.largeText?'1.4':'1');root.style.setProperty('--ac-width',prefs.width+'px');sections.forEach(s=>render(s.dataset.layout));}
    const layer=root.querySelector('#ac-dialog-layer'),dialogBody=layer.querySelector('.ac-dialog-body'),dialogActions=layer.querySelector('.ac-dialog-actions'),dialogTitle=layer.querySelector('#ac-dialog-title');
    function close(){layer.hidden=true;const target=returnFocus?.isConnected?returnFocus:root.querySelector('[data-layout="'+activeKey+'"] [data-open-card]');target?.focus?.();}
    function show(title,key){activeKey=key;returnFocus=document.activeElement;dialogTitle.textContent=title;dialogBody.replaceChildren();dialogActions.replaceChildren();layer.hidden=false;layer.querySelector('.ac-close').focus?.();}
    layer.querySelector('.ac-close').addEventListener('click',close);layer.addEventListener('click',e=>{if(e.target===layer)close();});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!layer.hidden)close();if(e.key==='Tab'&&!layer.hidden){const nodes=[...layer.querySelectorAll('button,input,select')].filter(n=>!n.disabled&&!n.hidden);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus?.();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus?.();}}});
    function input(label,value,type='text'){const wrap=el('label','ac-input',label),field=el('input');field.type=type;field.value=value;field.setAttribute('aria-label',label);wrap.append(field);return {wrap,field};}
    function openEditor(key,trigger){show('Акт '+get(key).number,key);returnFocus=trigger;const draft=clone(get(key)),owner=input('Владелец',draft.owner),address=input('Адрес',draft.address);dialogBody.append(owner.wrap,address.wrap,el('p','ac-dialog-note','Дата работ: '+draft.date.split('-').reverse().join('.')));const meterInputs=[];draft.meters.forEach((m,index)=>{const block=el('section','ac-dialog-meter');block.append(el('h3','','Счётчик '+(index+1)));const fields={};for(const [field,label]of [['reg','Регистрационный номер'],['type','Тип СИ'],['serial','Заводской номер'],['method','Методика поверки']]){fields[field]=input(label,m[field]);block.append(fields[field].wrap);}const photoName=el('p','ac-dialog-note',m.photo||'Фото не добавлено'),file=el('input');file.type='file';file.accept='image/*';file.setAttribute('aria-label','Фото счётчика '+(index+1));file.addEventListener('change',()=>{const selected=file.files?.[0];if(selected){m.photo=selected.name;photoName.textContent=selected.name;}});block.append(photoName,file);meterInputs.push(fields);dialogBody.append(block);});dialogBody.append(el('p','ac-dialog-note','Изменения применяются только к этому примеру. Данные счётчиков учебные.'));dialogActions.append(action('Отмена',close,true),action('Сохранить',()=>{draft.owner=owner.field.value.trim();draft.address=address.field.value.trim();meterInputs.forEach((fields,i)=>{for(const field of Object.keys(fields))draft.meters[i][field]=fields[field].field.value.trim();});draft.sent=false;states.set(key,draft);render(key);close();}));paintIcons();}
    function confirmUpload(key){show('Выгрузить акт?',key);dialogBody.append(el('p','ac-dialog-note','В этом примере акт будет отмечен выгруженным. Отправка на сервер не выполняется.'));dialogActions.append(action('Отмена',close,true),action('Выгрузить',()=>{const a=get(key);if(issues(a).length)return;a.sent=true;a.sendError=false;render(key);close();}));paintIcons();}
    root.querySelector('#ac-example').addEventListener('change',e=>{example=e.target.value;states=new Map();close();renderAll();persist();});
    function persist(){window.openai?.setWidgetState?.({modelContent:{subject:'Поверка дома — компоновки карточки акта',example,appearance:prefs.appearance},privateContent:{actCardLayouts:{version:1,example,...prefs}}})?.catch?.(()=>{});}
    function restore(value){const saved=value?.privateContent?.actCardLayouts;if(!saved||saved.version!==1)return;if(['ready','global','photo','both','meter','error'].includes(saved.example)){if(example!==saved.example)states=new Map();example=saved.example;root.querySelector('#ac-example').value=example;}if(['auto','light','dark'].includes(saved.appearance))prefs.appearance=saved.appearance;if(['320','360','390','430'].includes(String(saved.width)))prefs.width=String(saved.width);prefs.largeText=saved.largeText===true;prefs.longData=saved.longData===true;renderAll();}
    renderAll();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(layer.hidden)restore(e.detail?.globals?.widgetState);});
    if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{renderAll();persist();}});t.addSelect(prefs,'appearance',{label:'Тема',options:[{value:'light',label:'Светлая'},{value:'dark',label:'Тёмная'},{value:'auto',label:'Системная'}]});t.addSelect(prefs,'width',{label:'Ширина',options:[{value:'320',label:'320 px'},{value:'360',label:'360 px'},{value:'390',label:'390 px'},{value:'430',label:'430 px'}]});t.addToggle(prefs,'largeText',{label:'Увеличенный текст'});t.addToggle(prefs,'longData',{label:'Длинные данные'});}
    root.actCardLayouts={getConfig:()=>clone(config),getState:key=>clone(get(key)),getPreferences:()=>({...prefs}),setExample:value=>{if(!['ready','global','photo','both','meter','error'].includes(value))return;example=value;root.querySelector('#ac-example').value=value;states=new Map();close();renderAll();},renderAll,issues:key=>issues(get(key)),close};
  })();
  </script>
