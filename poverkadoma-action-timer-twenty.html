<script>
(() => {
  const root=document.getElementById('pd-action-timer-twenty');
  const defaults={minutes:15,action:'accept',appearance:'light',largeText:false,liked:[]};
  const settings={...defaults};
  const names=new Map([...root.querySelectorAll('[data-design]')].map(n=>[n.dataset.design,n.dataset.variant]));
  const el=(tag,cls='',value)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n;};
  const icon=name=>{const n=el('span','at-icon'),i=el('i');i.setAttribute('data-lucide',name);i.setAttribute('aria-hidden','true');n.setAttribute('aria-hidden','true');n.append(i);return n;};
  const action=()=>settings.action==='agree'?'Согласовать':'Принять';
  const deadline=m=>m<=0?'Срок истёк':'Осталось '+m+' мин';
  const time=m=>{const n=el('span','at-time');n.append(el('span','at-time-label',m<=0?'':'Осталось'),el('span','at-time-value',m<=0?'Срок истёк':m+' мин'));return n;};
  const track=()=>{const n=el('span','at-track');n.setAttribute('aria-hidden','true');n.append(el('span','at-track-fill'));return n;};
  const box=(m,withIcon=false)=>{const n=el('span','at-timer-box');if(withIcon)n.append(icon(m<=0?'alarm-clock-off':'timer'));n.append(time(m));return n;};
  const label=()=>el('span','at-action',action());
  const urgency=m=>m<=0?'expired':m<=5?'critical':m<=15?'warning':'normal';
  function fillCopy(m){const n=el('span','at-fill-copy');n.append(el('span','',action()),el('span','',deadline(m)));return n;}
  function control(style,m,isMain=false){
    const b=el('button','at-control cursor-interaction');b.type='button';b.dataset.style=style;b.dataset.minutes=String(m);b.dataset.urgency=urgency(m);b.dataset.main=String(isMain);b.style.setProperty('--at-fraction',Math.max(0,Math.min(100,m/60*100))+'%');b.style.setProperty('--at-remaining',Math.max(0,Math.min(1,m/60)));b.setAttribute('aria-label',action()+' заявку МСР-12341. '+deadline(m)+'. Открыть диалог.');
    if(style==='fill'){b.append(fillCopy(m));const overlay=fillCopy(m);overlay.classList.add('at-fill-overlay');overlay.setAttribute('aria-hidden','true');b.append(overlay);}
    else if(style==='signal'){b.append(label(),box(m));}
    else if(style==='split'){const meter=el('span','at-split-meter');meter.append(time(m),track());b.append(label(),meter);}
    else if(style==='badge'){b.append(label(),box(m,true));}
    else if(style==='footer'||style==='crown'||style==='edge'){b.append(label(),time(m),track());}
    else if(style==='segments'){const parts=el('span','at-segments');parts.setAttribute('aria-hidden','true');for(let i=0;i<4;i++){const p=el('span','at-segment'),fill=el('span');fill.style.width=Math.max(0,Math.min(1,m/15-i))*100+'%';p.append(fill);parts.append(p);}b.append(label(),time(m),parts);}
    else if(style==='battery'){const battery=el('span','at-battery'),meter=el('span','at-battery-meter');meter.setAttribute('aria-hidden','true');for(let i=0;i<6;i++){const p=el('span','at-battery-cell');p.dataset.filled=String(m>i*10);meter.append(p);}battery.append(time(m),meter);b.append(label(),battery);}
    else if(style==='ring'){const combo=el('span','at-ring-combo');if(m<=0){combo.append(el('span','at-time-value','Срок истёк'));}else{const ring=el('span','at-ring');ring.setAttribute('aria-hidden','true');ring.append(el('span','',String(m)),el('span','at-unit','мин'));combo.append(el('span','at-ring-label','Осталось'),ring);}b.append(label(),combo);}
    else if(style==='outline'){b.append(label(),time(m));const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('class','at-outline-meter');svg.setAttribute('width','100%');svg.setAttribute('height','100%');svg.setAttribute('aria-hidden','true');for(let i=0;i<2;i++){const r=document.createElementNS(ns,'rect');r.setAttribute('x','3');r.setAttribute('y','3');r.setAttribute('width','100%');r.setAttribute('height','100%');r.style.width='calc(100% - 6px)';r.style.height='calc(100% - 6px)';r.setAttribute('rx','12');r.setAttribute('pathLength','100');svg.append(r);}b.append(svg);}
    else if(style==='leading'){const left=el('span','at-leading-box');left.append(time(m),track());b.append(label(),left);}
    else if(style==='explicit'){const top=el('span','at-explicit-top'),bottom=el('span','at-explicit-bottom');top.append(label(),icon('arrow-right'));bottom.append(el('span','',deadline(m)),track());b.append(top,bottom);}
    else if(style==='deadline'){const stack=el('span','at-deadline-stack'),upper=el('span','at-deadline-top'),clock=String(14+Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');upper.append(icon(m<=0?'alarm-clock-off':'clock-3'),el('span','',m<=0?'Срок истёк':'До '+clock));stack.append(upper,el('span','at-deadline-remain',m<=0?'Время вышло':m+' мин осталось'));b.append(label(),stack);}
    else if(style==='ruler'){const ruler=el('span','at-ruler');ruler.setAttribute('aria-hidden','true');ruler.append(track());b.append(label(),time(m),ruler);}
    else if(style==='window'){const window=el('span','at-window');window.append(time(m),track());b.append(label(),window);}
    else if(style==='dots'){const side=el('span','at-dotted-action'),dots=el('span','at-dots');dots.setAttribute('aria-hidden','true');for(let i=0;i<10;i++){const dot=el('span');dot.dataset.filled=String(m>i*6);dots.append(dot);}side.append(label(),dots);b.append(side,time(m));}
    else if(style==='seal'){const seal=el('span','at-seal'),symbol=el('span','at-seal-icon');symbol.append(icon(m<=0?'alarm-clock-off':m<=5?'alarm-clock':'clock-3'));seal.append(symbol,time(m));b.append(label(),seal);}
    else if(style==='tab'){const tab=el('span','at-tab');tab.append(time(m),track());b.append(label(),tab);}
    else if(style==='countdown'){const count=el('span','at-countdown');if(m<=0)count.append(time(m));else{const unit=el('span','at-countdown-unit');unit.append(el('span','','мин'),el('span','','осталось'));count.append(el('span','at-countdown-value',String(m)),unit);}b.append(label(),count);}
    b.addEventListener('click',()=>openDialog(b,style,m));return b;
  }
  function card(style){const c=el('article','at-card'),head=el('div','at-head'),state=el('span','at-state');c.dataset.status=settings.action==='agree'?'appointed':'new';state.append(el('span','at-dot'),el('span','',settings.action==='agree'?'Назначена':'Новая'));head.append(el('span','at-id','МСР-12341'),state);c.append(head,el('p','at-address','ул. Строителей, 18, кв. 24'));const facts=el('div','at-facts'),work=el('span','at-fact');work.append(icon('gauge'),el('span','','1 счётчик воды'));facts.append(work,el('span','','1 200 ₽'));const visit=el('div','at-facts'),day=el('span','at-fact'),hours=el('span','at-fact');day.append(icon('calendar-days'),el('span','','30 октября'));hours.append(icon('clock-3'),el('span','','15:00–17:00'));visit.append(day,hours);c.append(facts,visit,control(style,settings.minutes,true));return c;}
  const overlay=root.querySelector('.at-overlay'),dialog=overlay.querySelector('.at-dialog');let restoreFocus=null;
  function closeDialog(){overlay.hidden=true;restoreFocus?.focus?.();restoreFocus=null;}
  function openDialog(trigger,style,m){restoreFocus=trigger;root.querySelector('#at-dialog-title').textContent=m<=0?'Срок истёк':action()+' заявку?';root.querySelector('#at-dialog-message').textContent=m<=0?'Время на действие закончилось. В рабочем приложении доступность действия должна проверяться по актуальному состоянию заявки. Здесь можно сравнить только оформление.':'МСР-12341 · ул. Строителей, 18, кв. 24. '+deadline(m)+'. Это демонстрация кнопки; заявка не изменяется.';overlay.hidden=false;overlay.querySelector('.at-confirm').focus?.();}
  overlay.querySelector('.at-cancel').addEventListener('click',closeDialog);overlay.querySelector('.at-confirm').addEventListener('click',closeDialog);overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog();});overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const nodes=[...dialog.querySelectorAll('button')],first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  function save(){window.openai?.setWidgetState?.({modelContent:{subject:'Поверка дома — двадцать кнопок с индикатором',minutes:settings.minutes,action:settings.action,appearance:settings.appearance,largeText:settings.largeText,liked:settings.liked.map(key=>names.get(key))},privateContent:{actionTimerTwenty:{...settings}}})?.catch?.(()=>{});}
  function render(){closeDialog();root.dataset.appearance=settings.appearance;root.dataset.textSize=settings.largeText?'large':'normal';root.style.setProperty('--at-scale',settings.largeText?1.15:1);for(const [key,name]of names){const section=root.querySelector('[data-design="'+key+'"]'),stage=el('div','at-stage'),preview=el('div','at-preview');preview.setAttribute('aria-label','Карточка заявки: '+name);preview.append(card(key));const samples=el('div','at-samples');samples.append(el('p','at-samples-heading','Та же кнопка · другие сроки'));for(const m of [45,5,0]){const sample=el('div','at-sample');sample.append(control(key,m));samples.append(sample);}const like=el('button','at-like cursor-interaction');like.type='button';like.setAttribute('aria-pressed',String(settings.liked.includes(key)));like.setAttribute('aria-label',(settings.liked.includes(key)?'Убрать из избранного: ':'Нравится: ')+name);like.append(icon('heart'),el('span','',settings.liked.includes(key)?'В избранном':'Нравится этот вариант'));like.addEventListener('click',()=>{settings.liked=settings.liked.includes(key)?settings.liked.filter(x=>x!==key):[...settings.liked,key];like.setAttribute('aria-pressed',String(settings.liked.includes(key)));like.querySelector('span:last-child').textContent=settings.liked.includes(key)?'В избранном':'Нравится этот вариант';like.setAttribute('aria-label',(settings.liked.includes(key)?'Убрать из избранного: ':'Нравится: ')+name);save();});stage.append(preview,samples,like);section.replaceChildren(stage);}root.querySelectorAll('[data-preset]').forEach(n=>n.setAttribute('aria-pressed',String(Number(n.dataset.preset)===settings.minutes)));if(globalThis.lucide?.createIcons)globalThis.lucide.createIcons({attrs:{width:18,height:18}});}
  function restore(value){const stored=value?.privateContent?.actionTimerTwenty;if(!stored)return;settings.minutes=Number.isFinite(stored.minutes)?Math.max(0,Math.min(60,Math.round(stored.minutes))):15;settings.action=stored.action==='agree'?'agree':'accept';settings.appearance=stored.appearance==='dark'?'dark':'light';settings.largeText=stored.largeText===true;settings.liked=Array.isArray(stored.liked)?stored.liked.filter(x=>names.has(x)):[];render();}
  root.querySelectorAll('[data-preset]').forEach(n=>n.addEventListener('click',()=>{settings.minutes=Number(n.dataset.preset);render();root.querySelector('.at-live').textContent='На основной карточке: '+deadline(settings.minutes);save();}));
  restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(settings,'action',{label:'Действие заявки',options:[{label:'Принять новую',value:'accept'},{label:'Согласовать назначенную',value:'agree'}]});tweak.addSelect(settings,'appearance',{label:'Тема',options:[{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}]});tweak.addSlider(settings,'minutes',{label:'Осталось времени',min:0,max:60,step:1,unit:'мин'});tweak.addToggle(settings,'largeText',{label:'Увеличенный текст'});}
})();
