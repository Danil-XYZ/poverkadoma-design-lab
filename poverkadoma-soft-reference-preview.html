    { id: '000394', city: 'Тольятти', created: '20.12.2020', address: 'Комсомольская, 15', phone: '+7 (901) 123-45-67', phoneLabel: 'Контактный номер', state: 'Назначена', kind: 'appointed', action: 'Согласовать', agreementDue: '20.12.2020, 14:05', agreementTime: '14:05', agreementMinutesLeft: 15, indicator: 'warning', syncState: 'error', syncLabel: 'Ошибка', syncDescription: 'Не удалось отправить изменения заявки. Они сохранены на устройстве. Проверьте связь перед повторной отправкой.' },
    { id: '000393', city: 'Тольятти', created: '20.12.2020', address: 'Комсомольская, 15', visit: '22.12.2020, 13:00 - 14:00', state: 'Согласована', kind: 'agreed', action: 'Создать акт', agreementHistory: 'Заявка согласована на 20 минут позже контрольного срока. Это срок согласования, а не опоздание на визит.', indicator: 'upload', syncState: 'queued', syncLabel: 'В очереди', syncDescription: 'Изменения сохранены на устройстве и ожидают отправки на сервер.' },
    { id: '000396', city: 'Тольятти', created: '20.12.2020', address: 'Комсомольская, 15', canceled: '22.12.2020, 13:00', state: 'Отменена', kind: 'canceled', action: 'Вернуть', agreementHistory: 'Контроль срока согласования прекращён после отмены заявки.', indicator: 'upload', syncState: 'queued', syncLabel: 'В очереди', syncDescription: 'Изменения сохранены на устройстве и ожидают отправки на сервер.' }
  ];
  const root = document.getElementById('pd-soft-reference-preview');
  const app = root.querySelector('.phone');
  const list = root.querySelector('#requests');
  const toggle = root.querySelector('#search-toggle');
  const field = root.querySelector('#search-field');
  const input = root.querySelector('#search-input');
  const close = root.querySelector('#search-close');
  const empty = root.querySelector('#empty-state');
  const resultStatus = root.querySelector('#result-status');
  const controls = root.querySelector('#prototype-controls');
  const networkButtons = controls.querySelectorAll('[data-network]');
  const cornerButtons = controls.querySelectorAll('[data-corners]');
  const offlineIndicator = root.querySelector('#offline-indicator');
  const connectionStatus = root.querySelector('#connection-status');
  const cardData = root.querySelector('#card-data');
  const cardText = root.querySelector('#card-text');
  const requestScreen = root.querySelector('#request-screen');
  const requestScreenTitle = root.querySelector('#request-screen-title');
  const requestBack = root.querySelector('#request-back');
  const homeHeader = app.querySelector('.topbar');
  const homeList = app.querySelector('.requests-viewport');
  let selectedRequestId = '';
  app.dataset.screen = 'requests';

  function openRequest(id, focus = true) {
    const card = [...list.querySelectorAll('.request')].find(item => item.dataset.requestId === id);
    if (!card) return;
    selectedRequestId = id;
    requestScreenTitle.textContent = `Заявка №${id}`;
    homeHeader.hidden = true;
    homeList.hidden = true;
    requestScreen.hidden = false;
    app.dataset.screen = 'request';
    if (focus) requestBack.focus?.({ preventScroll: true });
  }
  function showRequests(focus = true) {
    const previousId = selectedRequestId;
    selectedRequestId = '';
    requestScreen.hidden = true;
    homeHeader.hidden = false;
    homeList.hidden = false;
    app.dataset.screen = 'requests';
    if (focus) [...list.querySelectorAll('.request')].find(item => item.dataset.requestId === previousId)?.querySelector('.request-entry')?.focus?.({ preventScroll: true });
  }
  requestBack.addEventListener('click', () => showRequests());
  app.querySelector('.bottom-navigation .nav-item').addEventListener('click', () => showRequests());

  function setCardChecks(data = 'normal', text = 'normal') {
    cardData.value = data === 'long' ? 'long' : 'normal';
    cardText.value = text === 'large' ? 'large' : 'normal';
    app.dataset.cardData = cardData.value;
    app.dataset.cardText = cardText.value;
    renderRequests();
  }
  cardData.addEventListener('change', () => setCardChecks(cardData.value, cardText.value));
  cardText.addEventListener('change', () => setCardChecks(cardData.value, cardText.value));
  app.dataset.cardData = 'normal';
  app.dataset.cardText = 'normal';

  function setNetwork(online, announce = false) {
    app.dataset.offline = String(!online);
    offlineIndicator.hidden = online;
    networkButtons.forEach(button => button.setAttribute('aria-pressed', String((button.dataset.network === 'online') === online)));
    if (announce) connectionStatus.textContent = online ? 'Есть интернет' : 'Нет интернета';
  }
  networkButtons.forEach(button => button.addEventListener('click', () => setNetwork(button.dataset.network === 'online', true)));
  setNetwork(true);

  function setCorners(rounded) {
    app.dataset.topbarCorners = rounded ? 'rounded' : 'square';
    cornerButtons.forEach(button => button.setAttribute('aria-pressed', String((button.dataset.corners === 'rounded') === rounded)));
  }
  cornerButtons.forEach(button => button.addEventListener('click', () => setCorners(button.dataset.corners === 'rounded')));
  setCorners(true);

  function icon(kind) {
    const [file, size, x, y, expanded] = icons[kind];
    const slot = document.createElement('span');
    slot.className = 'icon';
    slot.dataset.iconKind = kind;
    slot.setAttribute('aria-hidden', 'true');
    slot.style.width = size + 'px';
    slot.style.height = size + 'px';
    const img = document.createElement('img');
    img.src = assetData[`poverkadoma-home-${expanded ? 'expanded' : 'asset'}-${file}.svg`];
    img.alt = '';
    img.draggable = false;
    img.style.left = x + 'px';
    img.style.top = y + 'px';
    slot.append(img);
    return slot;
  }
  app.querySelectorAll('[data-icon]').forEach(slot => slot.replaceWith(icon(slot.dataset.icon)));

  function renderRequests() {
    const query = input.value.toLocaleLowerCase('ru').trim();
    const data = app.dataset.cardData === 'long' ? requests.map((item, index) => ({
      ...item,
      id: `2026-${item.id}-000128`,
      city: 'Санкт-Петербург',
      address: 'проспект Большой Сампсониевский, дом 126, корпус 2, квартира 108',
      ...(item.phone ? { phone: '+7 (901) 123-45-67, доб. 128', phoneDial: '+79011234567;ext=128' } : {}),
      ...(index === 1 ? { syncDescription: 'Изменения заявки сохранены на устройстве. Сервер не подтвердил получение. Проверьте подключение и уточните состояние заявки перед повторной отправкой.' } : {})
    })) : requests;
    const normalized = value => value.toLocaleLowerCase('ru').replace(/[^\p{L}\p{N}]/gu, '');
    const normalizedQuery = normalized(query);
    const matching = data.filter(item => `${item.address} ${item.city} ${item.phone || ''} ${item.id}`.toLocaleLowerCase('ru').includes(query) || (normalizedQuery.length > 0 && normalized(`${item.phone || ''} ${item.id}`).includes(normalizedQuery)));
    list.replaceChildren(...matching.map(item => {
      const card = document.createElement('article');
      card.className = 'request';
      card.dataset.requestId = item.id;
      card.setAttribute('aria-label', `Заявка №${item.id}`);
      card.dataset.state = item.kind;
      const head = document.createElement('div');
      head.className = 'request-head';
      const top = document.createElement('div');
      top.className = 'request-heading';
      const number = document.createElement('div');
      number.className = 'request-number';
      const numberLabel = document.createElement('span');
      numberLabel.className = 'request-id';
      numberLabel.textContent = '№ ' + item.id;
      number.append(numberLabel);
      if (item.indicator && item.syncState) {
        const sync = document.createElement('span');
        sync.className = 'request-sync ' + item.syncState;
        sync.append(icon(item.indicator), document.createTextNode(item.syncLabel));
        number.append(sync);
      }
      const state = document.createElement('div');
      state.className = 'request-state' + (item.state === 'Согласована' ? ' agreed' : '');
      const dot = document.createElement('span');
      dot.className = 'status-dot';
      dot.setAttribute('aria-hidden', 'true');
      state.append(dot, document.createTextNode(item.state));
      const created = document.createElement('time');
      created.className = 'request-created';
      created.dateTime = item.created.split('.').reverse().join('-');
      created.textContent = 'Создана ' + item.created;
      created.setAttribute('aria-label', 'Дата создания: ' + item.created);
      top.append(number, state);
      head.append(top);
      const deadline = document.createElement('div');
      deadline.className = 'deadline-summary';
      deadline.append(created);
      if (['new', 'appointed'].includes(item.kind) && Number.isFinite(item.agreementMinutesLeft)) {
        const minutes = item.agreementMinutesLeft;
        const urgent = minutes <= 15;
        const deadlineCaption = document.createElement('span');
        deadlineCaption.className = 'deadline-caption' + (urgent ? ' urgent' : '');
        if (urgent) deadlineCaption.append(icon('clock'));
        deadlineCaption.append(document.createTextNode(minutes < 0
          ? `Согласование просрочено на ${Math.abs(minutes)} мин`
          : minutes === 0 ? 'Срок согласования истекает сейчас'
          : urgent ? `Согласовать: ещё ${minutes} мин` : `Согласовать до ${item.agreementTime}`));
        deadlineCaption.setAttribute('aria-label', `${deadlineCaption.textContent}. Срок согласования: ${item.agreementDue}`);
        deadline.append(deadlineCaption);
      }
      const details = document.createElement('div');
      details.className = 'request-facts';
      const address = document.createElement('p');
      address.className = 'request-address';
      const city = document.createElement('span');
      city.className = 'request-city';
      city.textContent = item.city + ', ';
      address.setAttribute('aria-label', 'Адрес: ' + item.city + ', ' + item.address);
      address.append(city, document.createTextNode(item.address));
      details.append(address);
      if (item.phone) {
        const phone = document.createElement('p');
        phone.className = 'request-phone';
        const label = document.createElement('span');
        label.className = 'field-label';
        label.textContent = item.phoneLabel + ': ';
        phone.append(label, document.createTextNode(item.phone));
        details.append(phone);
      }
      if (item.visit || item.canceled) {
        const date = document.createElement('p');
        date.className = 'request-date';
        date.textContent = (item.canceled ? 'Отмена: ' : 'Визит: ') + (item.canceled || item.visit).replace(' - ', '–');
        details.append(date);
      }
      const actions = document.createElement('div');
      actions.className = 'request-actions';
      const action = document.createElement('button');
      action.type = 'button';
      action.className = 'request-action primary';
      action.setAttribute('aria-label', `${item.action}, заявка №${item.id}`);
      const label = document.createElement('span');
      label.className = 'action-label';
      label.textContent = item.action;
      action.append(label);
      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'request-entry';
      open.append(icon('chevron'));
      open.setAttribute('aria-label', `Открыть заявку №${item.id}: ${item.city}, ${item.address}`);
      open.addEventListener('click', () => openRequest(item.id));
      actions.append(action);
      if (item.phone) {
        const dial = item.phoneDial || item.phone.replace(/[^+\d]/g, '');
        if (/^\+?\d{7,15}(?:;ext=\d{1,6})?$/.test(dial)) {
          const call = document.createElement('a');
          call.className = 'request-action request-call';
          call.href = 'tel:' + dial;
          call.setAttribute('aria-label', `Позвонить по номеру ${item.phone}, заявка №${item.id}`);
          call.append(icon('call'));
          actions.append(call);
        }
      }
      card.append(open, head, details, deadline, actions);
      return card;
    }));
    empty.hidden = matching.length !== 0;
    resultStatus.textContent = query ? `Найдено заявок: ${matching.length}` : '';
  }

  function setSearch(open, focus = true) {
    field.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    toggle.replaceChildren(icon(open ? 'search-white' : 'search'));
    if (open && focus) input.focus({ preventScroll: true });
    if (!open) {
      input.value = '';
      renderRequests();
      if (focus) toggle.focus({ preventScroll: true });
    }
  }
  toggle.addEventListener('click', () => setSearch(field.hidden));
  close.addEventListener('click', () => setSearch(false));
  input.addEventListener('input', renderRequests);
  input.addEventListener('keydown', event => {
    if (event.key === 'Escape') setSearch(false);
  });
  // Historical Figma examples. The period selector previews its appearance;
  // live date filtering belongs to the next functional prototype step.
  app.querySelectorAll('[data-period]').forEach(button => button.addEventListener('click', () => {
    app.querySelectorAll('[data-period]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
  }));
  renderRequests();
  const persist = () => window.openai?.setWidgetState?.({
    modelContent: { concept: 'Мягкие поверхности — по референсу', screen: selectedRequestId ? 'Заявка' : 'Заявки', searchOpen: !field.hidden, offline: app.dataset.offline === 'true', roundedTopbar: app.dataset.topbarCorners !== 'square', cardData: app.dataset.cardData, cardText: app.dataset.cardText },
    privateContent: { query: input.value.slice(0, 200), period: app.querySelector('[data-period][aria-pressed="true"]')?.dataset.period, selectedRequestId }
  }).catch(() => {});
  const restore = state => {
    if (!state) return;
    const saved = state.privateContent || {};
    setNetwork(!state.modelContent?.offline);
    setCorners(state.modelContent?.roundedTopbar !== false);
    showRequests(false);
    setCardChecks(state.modelContent?.cardData, state.modelContent?.cardText);
    setSearch(Boolean(state.modelContent?.searchOpen), false);
    input.value = String(saved.query || '').slice(0, 200);
    if (saved.period) app.querySelectorAll('[data-period]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.period === saved.period)));
    renderRequests();
    if (typeof saved.selectedRequestId === 'string' && saved.selectedRequestId.length < 120) openRequest(saved.selectedRequestId, false);
  };
  restore(window.openai?.widgetState);
  toggle.addEventListener('click', persist);
  close.addEventListener('click', persist);
  input.addEventListener('input', persist);
  app.querySelectorAll('[data-period]').forEach(item => item.addEventListener('click', persist));
  networkButtons.forEach(item => item.addEventListener('click', persist));
  cornerButtons.forEach(item => item.addEventListener('click', persist));
  cardData.addEventListener('change', persist);
  cardText.addEventListener('change', persist);
  list.addEventListener('click', event => { if (event.target.closest('.request-entry')) persist(); });
  requestBack.addEventListener('click', persist);
  app.querySelector('.bottom-navigation .nav-item').addEventListener('click', persist);
  input.addEventListener('keydown', event => { if (event.key === 'Escape') persist(); });
  window.addEventListener('openai:set_globals', event => restore(event.detail?.globals?.widgetState));
})();

</script>
