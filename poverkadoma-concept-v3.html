function roleHandleV3(a,id,el){

 const showErrors=()=>{repaint();roleAfterRenderV3();root.querySelector('[aria-invalid="true"]')?.focus();};
 switch(a){
 case 'role-new-bid':if(!roleCanCreateBidV3()){r.notice='Создание заявок недоступно.';repaint();return true;}roleRequestDraftV3('');navigate('bid-new');return true;
 case 'role-edit-bid':if(!r.bids[id]||!roleBidEditableV3(r.bids[id]))return true;roleRequestDraftV3(id);navigate('bid-new');return true;
 case 'save-bid':{
  const d=r.request;if(!d)return true;r.errors={};
  if(d.address.trim().replace(/[^а-яёa-z]/gi,'').length<3)r.errors['request.address']='Укажите адрес.';
  if(d.client.trim().length<2)r.errors['request.client']='Укажите имя заказчика.';
  if(!/^\d{10,11}$/.test(d.phone.replace(/\D/g,'')))r.errors['request.phone']='Проверьте номер телефона: 10 цифр или 11 с кодом страны.';
  if(d.count!==''&&(!Number.isInteger(Number(d.count))||Number(d.count)<1||Number(d.count)>6))r.errors['request.count']='Укажите от 1 до 6 или оставьте поле пустым.';
  if(d.amount!==''&&(!Number.isFinite(Number(d.amount))||Number(d.amount)<0))r.errors['request.amount']='Стоимость не может быть отрицательной.';
  if(Object.keys(r.errors).length){showErrors();return true;}
  if(S.role==='agent'&&!roleAgentActiveV3()){r.notice='Создание и изменение заявок отключено.';repaint();return true;}

      case 'help-start':modal('Начало работы',pModal('Откройте заявку или создайте акт. Добавьте счётчики, выполните измерения и проверьте данные. Сохранённый акт можно отправить сразу или позже.'),btn('К актам','acts','','primary full'));return;
      case 'help-upload':modal('Если акт не отправляется',pModal('Откройте «Отправка актов». Рядом с актом указана причина и действие для исправления. Сам акт и фотографии остаются на телефоне.'),btn('Проверить отправки','upload','','primary full'));return;
      case 'help-nepton':navigate('nepton');return;
      case 'help-access':modal('Доступ к приложению',pModal('Идентификатор выдаёт лаборатория. Если указана электронная почта, доступ можно восстановить кодом из письма. Агент без почты обращается к создавшему его поверителю.'),btn('Вернуться ко входу','login','','primary full'));return;
      default:toast('Действие выбрано.');
    }
  }
  root.addEventListener('click',e=>{
    const el=e.target.closest('button,[data-view]');if(!el||!root.contains(el)||el.disabled)return;
    if(el.dataset.view){S.view=el.dataset.view;render();persist();return;}
    if(el.dataset.roleNav){S.role=el.dataset.roleNav;S.navStack=[];navigate(el.dataset.screen,'',true);return;}
    if(el.dataset.nav){closeModal();navigate(el.dataset.nav,el.dataset.id||'');return;}
    if(el.dataset.action)handle(el.dataset.action,el.dataset.id||'',el);
  });
  root.addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.bind)S.formValues[el.dataset.bind]=el.value;
    if(el.dataset.action==='form-field'){writeField(el.dataset.id,el.type==='checkbox'?el.checked:el.value);if(S.formErrors)delete S.formErrors[el.dataset.id];if(el.dataset.id==='history.query'){const caret=el.selectionStart;repaint();const input=root.querySelector('input[name="history.query"]');input?.focus();input?.setSelectionRange(caret,caret);}}
    if(el.dataset.search==='bids'){S.search=el.value;const caret=el.selectionStart;repaint();const inp=root.querySelector('[data-search="bids"]');inp.focus();inp.setSelectionRange(caret,caret);}
  });
  root.addEventListener('change',e=>{
    const el=e.target;
    if(el.hasAttribute('data-preview-role')){closeModal();S.role=el.value;S.bidId='17658';S.bidRecords={};S.bidStatus=['agent','dispatcher'].includes(S.role)?'Новая':'Согласована';S.cancelled=false;S.assigned=false;titles.bid='Заявка № 17658';S.filter=['agent','dispatcher'].includes(S.role)?'all':'today';S.screen=roles[S.role].start;S.navStack=[];S.search='';S.view='prototype';render();persist();return;}
    if(el.hasAttribute('data-preview-screen')){navigate(el.value);return;}
    if(el.hasAttribute('data-preview-state')){closeModal();S.offline=el.value==='offline';S.readDoc=el.value!=='document';repaint();if(!S.offline&&S.upload.queueEnabled){const ids=uploadItems().filter(x=>x.status==='queued').map(x=>x.id);if(ids.length)sendUploads(ids);}return;}
    if(el.dataset.action==='toggle-large'){S.large=el.checked;S.fontScale=S.large?1.3:1;repaint();return;}
    if(el.dataset.action==='meter-step-select'){handle('meter-step',el.value,el);return;}
    if(el.dataset.action==='theme'){S.theme=el.value;repaint();return;}
    if(el.dataset.action==='form-field'){writeField(el.dataset.id,el.type==='checkbox'?el.checked:el.value);if(el.tagName==='SELECT'||el.type==='checkbox')repaint();return;}
    if(el.dataset.action==='upload-select'){const old=S.upload.selected||pendingIds();S.upload.selected=el.checked?[...new Set([...old,el.dataset.id])]:old.filter(x=>x!==el.dataset.id);repaint();}
  });
  root.addEventListener('keydown',e=>{
    const dialog=root.querySelector('[role="dialog"]');if(!dialog)return;
    if(e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(e.key==='Tab'){const q=[...dialog.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled),first=q[0],last=q.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  });
  const saved=window.openai?.widgetState?.privateContent;
  if(saved?.revision==='v3'&&roles[saved.role]){for(const key of ['role','large','offline','theme','fontScale'])if(saved[key]!==undefined)S[key]=saved[key];if(titles[saved.screen])S.screen=saved.screen;}
  window.addEventListener('openai:set_globals',e=>{const p=e.detail?.globals?.widgetState?.privateContent;if(!localEdits&&p?.revision==='v3'&&p.session!==previewSession&&roles[p.role]){S.role=p.role;S.screen=titles[p.screen]?p.screen:roles[p.role].start;S.large=!!p.large;S.fontScale=p.fontScale||(S.large?1.3:1);S.offline=!!p.offline;S.theme=p.theme||'auto';render();}});
  uploadItems();
  render();
  window.addEventListener('load',refreshIcons,{once:true});
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root.querySelector('.pd-phone'),onChange:()=>{if(!S.offline&&S.upload.queueEnabled){const ids=uploadItems().filter(x=>x.status==='queued').map(x=>x.id);if(ids.length){sendUploads(ids);return;}}repaint();}});
    tweak.addSlider(S,'fontScale',{label:'Размер текста',min:1,max:2,step:.1,reference:'pd.font.scale'});
    tweak.addSelect(S,'theme',{label:'Тема',options:[{label:'Как на устройстве',value:'auto'},{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}],reference:'pd.appearance'});
  }
  window.PD_CONCEPT={state:S,navigate,render,roles,screenNames:titles};
})();

</script>
