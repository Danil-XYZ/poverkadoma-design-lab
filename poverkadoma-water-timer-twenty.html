<div id="pd-water-timer-twenty" class="viz-dotted-background">
  <div class="viz-controls" role="group" aria-label="Остаток времени в карточке">

    <button class="btn" type="button" data-minutes="45" aria-pressed="false">45 мин</button>
    <button class="btn" type="button" data-minutes="15" aria-pressed="true">15 мин</button>
    <button class="btn" type="button" data-minutes="5" aria-pressed="false">5 мин</button>

    <section data-variant="Мягкая капсула" data-design="capsule" hidden></section>
    <section data-variant="Полукруг" data-design="semicircle" hidden></section>
    <section data-variant="Косой срез" data-design="slope" hidden></section>
    <section data-variant="Билет" data-design="ticket" hidden></section>
    <section data-variant="Скруглённая вкладка" data-design="rounded-tab" hidden></section>
    <section data-variant="Волна у основания" data-design="bottom-wave" hidden></section>
    <section data-variant="Уровень воды" data-design="water-level" hidden></section>
    <section data-variant="Сначала время" data-design="leading" hidden></section>
    <section data-variant="Окошко" data-design="window" hidden></section>
    <section data-variant="Сигнальный бортик" data-design="edge" hidden></section>
    <section data-variant="Дорожка времени" data-design="track" hidden></section>
    <section data-variant="Час по четвертям" data-design="quarters" hidden></section>
    <section data-variant="Запас в точках" data-design="dots" hidden></section>
    <section data-variant="Овальный циферблат" data-design="dial" hidden></section>
    <section data-variant="Бирка" data-design="tag" hidden></section>
    <section data-variant="Время и дедлайн" data-design="deadline" hidden></section>
    <section data-variant="Сигнальный угол" data-design="corner" hidden></section>
    <section data-variant="Нижняя лента" data-design="ribbon" hidden></section>
    <section data-variant="Таймер и стрелка" data-design="arrow" hidden></section>

      <p id="wt-description"></p>
      <div class="wt-dialog-actions">
        <button class="wt-close cursor-interaction" type="button">Назад</button>
        <button class="wt-understood cursor-interaction" type="button">Понятно</button>
      </div>
    </section>
  </div>
  <span class="wt-live" role="status" aria-live="polite"></span>
</div>
<style>

  #pd-water-timer-twenty .wt-button[data-style="water-level"] .wt-time { color:var(--wt-ink); }
  #pd-water-timer-twenty .wt-water-fill { position:absolute; left:0; right:0; bottom:0; height:var(--wt-fraction); background:color-mix(in srgb,var(--wt-signal) 15%,var(--wt-surface)); clip-path:var(--wt-water-wave); }

  #pd-water-timer-twenty .wt-button[data-style="edge"][data-urgency="expired"] .wt-edge-meter { background:var(--wt-critical); }

  #pd-water-timer-twenty .wt-part { flex:1; background:#ffffff40; overflow:hidden; border-radius:2px; }

  #pd-water-timer-twenty .wt-dots > span[data-filled="true"] { background:var(--wt-white); }

<script>
(() => {
  const root=document.getElementById('pd-water-timer-twenty');
  const config={minutes:15,action:'accept',theme:'light',width:390,liked:[]};
  const names=new Map([...root.querySelectorAll('[data-design]')].map(n=>[n.dataset.design,n.dataset.variant]));
  const el=(tag,cls='',value)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n;};
  const icon=name=>{const n=el('span','wt-icon'),i=el('i');n.setAttribute('aria-hidden','true');i.setAttribute('data-lucide',name);i.setAttribute('aria-hidden','true');n.append(i);return n;};
  const action=()=>config.action==='agree'?'Согласовать':'Принять';
  const deadline=m=>m<=0?'Срок истёк':'Осталось '+m+' мин';
  const urgency=m=>m<=0?'expired':m<=5?'critical':m<=15?'warning':'normal';
  function wave(vertical){const points=[];if(vertical){points.push('10px 0','100% 0','100% 100%');for(let i=48;i>=0;i--){const x=7+5*Math.sin(i/48*Math.PI*4);points.push(x.toFixed(2)+'px '+(i/48*100).toFixed(2)+'%');}}else{points.push('0 100%','100% 100%');for(let i=100;i>=0;i-=2)points.push(i+'% '+(2.5+1.8*Math.sin(i/100*Math.PI*8)).toFixed(2)+'px');}return 'polygon('+points.join(',')+')';}
  root.style.setProperty('--wt-wave',wave(true));root.style.setProperty('--wt-horizontal-wave',wave(false));root.style.setProperty('--wt-water-wave',wave(false));
  function time(m,style){const n=el('span','wt-time');let caption=m<=0?'Срок':'Осталось',value=m<=0?'истёк':m+' мин';if(style==='deadline'&&m>0){caption='До '+String(14+Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}n.append(el('span','wt-time-label',caption),el('span','wt-time-value',value));return n;}
  function meter(cls){const n=el('span',cls);n.setAttribute('aria-hidden','true');n.append(el('span'));return n;}
  function control(style,m,main=false){
    const b=el('button','wt-button cursor-interaction');b.type='button';b.dataset.style=style;b.dataset.minutes=String(m);b.dataset.main=String(main);b.dataset.urgency=urgency(m);b.setAttribute('aria-label',action()+' заявку МСР-12341. '+deadline(m)+'. Открыть диалог.');b.style.setProperty('--wt-fraction',Math.max(0,Math.min(100,m/60*100))+'%');b.style.setProperty('--wt-ratio',Math.max(0,Math.min(1,m/60)));const label=el('span','wt-action',action()),panel=el('span','wt-panel');panel.append(time(m,style));b.append(label,panel);
    if(style==='bottom-wave')b.append(meter('wt-bottom-wave'));
    if(style==='water-level')panel.prepend(meter('wt-water-fill'));
    if(style==='edge')panel.append(meter('wt-edge-meter'));
    if(style==='track')b.append(meter('wt-main-meter'));
    if(style==='quarters'){const parts=el('span','wt-parts');parts.setAttribute('aria-hidden','true');for(let i=0;i<4;i++){const segment=el('span','wt-part'),fill=el('span');fill.style.width=Math.max(0,Math.min(1,m/15-i))*100+'%';segment.append(fill);parts.append(segment);}b.append(parts);}
    if(style==='dots'){const dots=el('span','wt-dots');dots.setAttribute('aria-hidden','true');for(let i=0;i<8;i++){const dot=el('span');dot.dataset.filled=String(m>i*7.5);dots.append(dot);}b.append(dots);}
    if(style==='ribbon')b.append(meter('wt-ribbon'));
    if(style==='arrow'){const next=el('span','wt-next');next.append(icon('chevron-right'));b.append(next);}
    b.addEventListener('click',()=>openDialog(b,m));return b;
  }
  function card(style){const c=el('article','wt-card');c.dataset.status=config.action==='agree'?'appointed':'new';const head=el('div','wt-card-head'),status=el('span','wt-status');status.append(el('span','wt-dot'),el('span','',config.action==='agree'?'Назначена':'Новая'));head.append(el('span','wt-id','МСР-12341'),status);const service=el('div','wt-facts'),work=el('span','wt-fact');work.append(icon('gauge'),el('span','','1 счётчик воды'));service.append(work,el('span','','1 200 ₽'));const visit=el('div','wt-facts'),date=el('span','wt-fact'),hours=el('span','wt-fact');date.append(icon('calendar-days'),el('span','','31 октября'));hours.append(icon('clock-3'),el('span','','15:00–17:00'));visit.append(date,hours);c.append(head,el('p','wt-address','ул. Строителей, 18, кв. 24'),service,visit,control(style,config.minutes,true));return c;}
  const overlay=root.querySelector('.wt-overlay');let returnFocus=null;
  function closeDialog(){overlay.hidden=true;returnFocus?.focus?.();returnFocus=null;}
  function openDialog(button,m){returnFocus=button;root.querySelector('#wt-title').textContent=m<=0?'Срок истёк':action()+' заявку?';root.querySelector('#wt-description').textContent=m<=0?'Это демонстрация оформления. В рабочем приложении возможность действия после истечения срока должна определяться актуальным состоянием заявки.':'МСР-12341 · ул. Строителей, 18, кв. 24. '+deadline(m)+'. Это демонстрация кнопки, данные заявки не изменяются.';overlay.hidden=false;overlay.querySelector('.wt-understood').focus?.();}
  overlay.querySelector('.wt-close').addEventListener('click',closeDialog);overlay.querySelector('.wt-understood').addEventListener('click',closeDialog);overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog();});overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const first=overlay.querySelector('.wt-close'),last=overlay.querySelector('.wt-understood');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  let lastSaved='';
  function save(){lastSaved=JSON.stringify(config);window.openai?.setWidgetState?.({modelContent:{subject:'Поверка дома — голубая кнопка и таймер,48px',minutes:config.minutes,action:config.action,theme:config.theme,liked:config.liked.map(key=>names.get(key))},privateContent:{waterTimerTwenty:{...config}}})?.catch?.(()=>{});}
  function render(){closeDialog();root.dataset.theme=config.theme;root.style.setProperty('--wt-width',config.width+'px');for(const [key,name]of names){const section=root.querySelector('[data-design="'+key+'"]'),stage=el('div','wt-stage'),context=el('div','wt-context');context.setAttribute('aria-label','Карточка заявки: '+name);context.append(card(key));const samples=el('div','wt-samples');samples.append(el('p','wt-samples-heading','Та же кнопка · другие сроки'));for(const m of [45,5,0]){const item=el('div','wt-sample');item.append(control(key,m));samples.append(item);}const like=el('button','wt-like cursor-interaction');like.type='button';like.setAttribute('aria-pressed',String(config.liked.includes(key)));like.setAttribute('aria-label','Нравится вариант '+name);like.append(icon('heart'),el('span','',config.liked.includes(key)?'В избранном':'Нравится этот вариант'));like.addEventListener('click',()=>{config.liked=config.liked.includes(key)?config.liked.filter(x=>x!==key):[...config.liked,key];like.setAttribute('aria-pressed',String(config.liked.includes(key)));like.querySelector('span:last-child').textContent=config.liked.includes(key)?'В избранном':'Нравится этот вариант';save();});stage.append(context,samples,like);section.replaceChildren(stage);}root.querySelectorAll('.viz-controls [data-minutes]').forEach(n=>n.setAttribute('aria-pressed',String(Number(n.dataset.minutes)===config.minutes)));if(globalThis.lucide?.createIcons)globalThis.lucide.createIcons({attrs:{width:18,height:18}});}
  function restore(value){const saved=value?.privateContent?.waterTimerTwenty;if(!saved)return;const next={minutes:Number.isFinite(saved.minutes)?Math.max(0,Math.min(60,Math.round(saved.minutes))):15,action:saved.action==='agree'?'agree':'accept',theme:saved.theme==='dark'?'dark':'light',width:Number.isFinite(saved.width)?Math.max(320,Math.min(430,Math.round(saved.width))):390,liked:Array.isArray(saved.liked)?saved.liked.filter(x=>names.has(x)):[]};const signature=JSON.stringify(next);if(signature===lastSaved)return;Object.assign(config,next);render();}
  root.querySelectorAll('.viz-controls [data-minutes]').forEach(n=>n.addEventListener('click',()=>{config.minutes=Number(n.dataset.minutes);render();root.querySelector('.wt-live').textContent='На карточке: '+deadline(config.minutes);save();}));restore(window.openai?.widgetState);render();window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(config,'action',{label:'Действие заявки',options:[{label:'Принять новую',value:'accept'},{label:'Согласовать назначенную',value:'agree'}]});tweak.addSelect(config,'theme',{label:'Тема',options:[{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}]});tweak.addSlider(config,'minutes',{label:'Осталось времени',min:0,max:60,step:1,unit:'мин'});tweak.addSlider(config,'width',{label:'Ширина макета',min:320,max:430,step:1,unit:'px'});}
})();
</script>
