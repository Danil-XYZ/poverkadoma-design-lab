  function captureForm(){
    const form=content.querySelector('form[data-form]');if(!form)return;
    const data=Object.fromEntries(new FormData(form));const a=currentAct(),m=currentMeter(),name=form.dataset.form;
    if(['appointment','edit-bid','maintenance','meter-tools'].includes(name)){state.formDrafts=state.formDrafts||{};state.formDrafts[formKey(name)]=data;}
    if(name==='customer')Object.assign(a,data);
    if(name==='payment')Object.assign(a,{cost:data.cost,customerEmail:data.customerEmail});
    if(name==='identity'&&m)Object.assign(m,data,{passport:!!data.passport});
    if(name==='measurements'&&m){Object.assign(m,data);if(m.runs)m.runs.forEach((r,i)=>{r.value=data['run'+i]??r.value;r.volume=data['runVolume'+i]??r.volume;});}
    if(name==='support')state.supportDraft=data.text||'';
    if(name==='new-act')state.newActNumber=data.number||'';
    if(name==='arshin')state.arshinQuery=data.serial||'';
    if(name==='storage')Object.assign(state.storage,data);
    if(name==='add-meter')state.addMeterDraft=data;
  }
  function render(){
    app.dataset.theme=preferences.theme;app.dataset.large=String(preferences.large);app.style.setProperty('--pd-scale',preferences.large?'1.2':'1');
    content.innerHTML=(screens[state.view.name]||renderExtra)();
    message.textContent=notice;
    if(globalThis.lucide)lucide.createIcons({attrs:{width:21,height:21}});
    if(state.view.name==='add-meter'&&state.addMeterDraft){const f=content.querySelector('form');Object.entries(state.addMeterDraft).forEach(([k,v])=>{if(f.elements[k]&&!['model','registry'].includes(k))f.elements[k].value=v;});}
    const f=content.querySelector('form[data-form]');const draft=f&&state.formDrafts?.[formKey(f.dataset.form)];
    if(f&&draft)Array.from(f.elements).forEach(input=>{if(!input.name)return;if(input.type==='checkbox')input.checked=!!draft[input.name];else if(draft[input.name]!==undefined)input.value=draft[input.name];});
  }
  function formKey(name){return [name,state.view.act||'',state.view.meter||'',state.view.bid||''].join(':');}
  function canServer(){
    if(preferences.offline){notify('Нет интернета. Действие не выполнено. Повторите после подключения.');return false;}return true;
  }
  function createAct(number){
    if((preferences.unread&&!state.documentRead)||preferences.toolBlocked){navigate('admission');return false;}
    if(state.acts.some(a=>a.id===number)){notify('Такой номер уже есть на телефоне. Откройте существующий акт или проверьте номер.');return false;}
    const bid=state.bids.find(b=>b.id===state.newActBid);
    const act={id:number,bid:bid?.id||null,owner:bid?.owner||'',address:bid?.address||'',flat:bid?.flat||'',phone:bid?.phone||'',date:'2026-10-26',type:'Годен',stage:'draft',receipt:false,actPhoto:false,cost:'900',meters:[]};
    state.acts.unshift(act);if(bid){bid.act=number;bid.status='В работе';}
    state.newActNumber='';state.tab='acts';navigate('act',{act:number});notify('Акт создан на телефоне. Данные заявки перенесены.');return true;
  }
  function perform(action,el){
    const a=currentAct(),m=currentMeter(),b=currentBid(),data=el.dataset;
    notice='';message.textContent='';
    if(action==='submit-form'){const form=el.closest('form');if(form&&form.reportValidity())submit(form);return;}
    if(action==='back'){captureForm();back();return;}
    if(action==='tab'){captureForm();tab(data.tab);return;}
    if(action==='bid'){navigate('bid',{bid:data.bid||state.view.bid});return;}
    if(action==='act'){navigate('act',{act:data.act||state.view.act});return;}
    if(action==='document'){navigate('document',{doc:data.doc||'procedure'});return;}
    if(action==='registry-detail'){navigate('registry-detail',{typeId:data.type||'16078-13',typeModel:data.model||'СХВ-15 / СГВ-15'});return;}
    if(action==='link-bid'&&state.view.name==='bid'){navigate('choose-act-for-bid');return;}
    if(action==='meter'){navigate('meter',{meter:data.meter||state.view.meter});return;}
    if(action==='bid-scope'){state.bidScope=data.value;render();saveState();return;}
    if(action==='all-bids'){state.bidScope='all';state.bidStatus='Все';render();saveState();return;}
    if(action==='act-scope'){state.actScope=data.value;render();saveState();return;}
    if(action==='bids-list'){tab('bids');return;}
    if(action==='local-list'){state.actScope='local';tab('acts');return;}
    if(action==='sent-list'){state.actScope='sent';tab('acts');return;}
    if(action==='start-new'){state.newActBid=null;state.newActNumber='';navigate('start-new',{act:null,bid:null,meter:null});return;}
    if(action==='start-from-bid'){if(b.service==='Замена счётчика'){navigate('service-done');return;}state.newActBid=b.id;state.newActNumber='';navigate('start-new',{act:null,meter:null});return;}
    if(action==='scan-act'){state.newActNumber='18432';render();notify('Подставлен пример номера из QR: 18432.');return;}
    if(action==='rescan-act'){const input=content.querySelector('input[name=number]');input.value='18433';notify('Подставлен пример другого бланка: 18433.');return;}
    if(action==='use-arshin-number'){state.arshinQuery='22003398';back();notify('Распознанный номер подставлен для проверки.');return;}
    if(action==='accept-bid'){if(!canServer())return;b.status='Назначена';render();notify('Заявка принята. Следующий шаг — согласовать визит.');return;}
    if(action==='return-bid'){if(!b.canRestore){notify('Период возврата завершён. Обратитесь к диспетчеру.');return;}if(!canServer())return;b.status='Назначена';render();notify('Пример: сервер разрешил возврат заявки в работу.');return;}
    if(action==='confirm-service'){if(!canServer())return;b.status='Выполнена';back();notify('Пример: выполнение услуги подтверждено сервером.');return;}
    if(action==='save-draft'){captureForm();a.stage=issues(a).length?'draft':'ready';state.actScope='local';tab('acts');notify(`Акт № ${a.id} сохранён на телефоне. На сервер не отправлялся.`);return;}
    if(action==='send-one'||action==='retry-one'){
      const target=data.act?state.acts.find(item=>item.id===data.act):a;
      if(!target)return;if(!canServer())return;
      if((preferences.unread&&!state.documentRead)||preferences.toolBlocked){navigate('admission');return;}
      if(issues(target).length){navigate('review',{act:target.id});return;}
      target.stage='sent';const linked=state.bids.find(bb=>bb.id===target.bid);if(linked)linked.status='Выполнена';navigate('send-result',{act:target.id});return;
    }
    if(action==='fix-issue'){navigate(data.target,{meter:data.meter||state.view.meter});return;}
    if(action==='photo'){navigate('photo-preview',{key:data.key});return;}
    if(action==='capture-photo'){setPhoto(true);render();notify('Пример фотографии добавлен на телефон.');return;}
    if(action==='remove-photo'){navigate('photo-delete',{key:state.view.key});return;}
    if(action==='confirm-remove-photo'){setPhoto(false);back();notify('Фотография удалена из примера.');return;}
    if(action==='recognize'){navigate('recognition');return;}
    if(action==='recognize-new'){state.addMeterDraft={model:'СХВ-15',registry:'16078-13',serial:'25001234',water:'Холодная',place:'Кухня'};navigate('add-meter',{model:'СХВ-15',registry:'16078-13'});notify('Пример распознавания. Сверьте номер и модель с паспортом.');return;}
    if(action==='apply-recognition'){m.serial='24018632';m.model='СГВ-15';back();notify('Результат распознавания подставлен. Проверьте его перед сохранением.');return;}
    if(action==='select-registry'){
      const parent=[...state.stack].reverse().find(v=>v.name==='meter-identity'||v.name==='add-meter');
      const selectedId=state.view.typeId||'16078-13',selectedModel=(state.view.typeModel||'СХВ-15').split(' / ')[0];
      if(parent?.name==='meter-identity'){m.model=selectedModel;m.registry=selectedId;}
      if(parent){while(state.stack.length&&state.stack[state.stack.length-1]!==parent)state.stack.pop();state.view={...state.stack.pop(),model:selectedModel,registry:selectedId};}else state.view={name:'references'};
      render();notify(`Выбран тип СИ ${selectedId}.`);return;
    }
    if(action==='remove-run'){captureForm();m.runs.splice(+data.index,1);render();saveState();return;}
    if(action==='add-run'){captureForm();m.runs=m.runs||[];if(m.runs.length>=2){notify('Показаны три измерения. Их состав определяется методикой.');return;}m.runs.push({value:'',volume:''});render();saveState();return;}
    if(action==='confirm-delete-meter'){a.meters=a.meters.filter(mm=>mm.id!==m.id);state.stack=state.stack.filter(v=>!v.meter);state.view={name:'meters',act:a.id};render();notify('Счётчик удалён из акта.');return;}
        if(action==='bind-bid'){const selected=state.bids.find(bb=>bb.id===data.bid);if(!selected)return;if(selected.act&&selected.act!==a.id){notify('У этой заявки уже есть другой акт. Сначала проверьте существующую связь.');return;}state.bids.forEach(bb=>{if(bb.act===a.id)bb.act=null;});a.bid=selected.id;selected.act=a.id;back();notify('Связь акта с заявкой изменена.');return;}
    if(action==='unbind-bid'){state.bids.forEach(bb=>{if(bb.act===a.id)bb.act=null;});a.bid=null;back();notify('Акт сохранён без заявки.');return;}
    if(action==='bind-act-to-bid'){const selected=state.acts.find(aa=>aa.id===data.act);if(!selected)return;if(selected.bid&&selected.bid!==b.id){notify('Этот акт связан с другой заявкой. Сначала проверьте его текущую связь.');return;}if(b.act&&b.act!==selected.id){notify('У заявки уже есть другой акт. Сначала проверьте его и снимите связь.');return;}b.act=selected.id;selected.bid=b.id;back();notify('Акт связан с заявкой.');return;}
    if(action==='nepton-connect'){state.neptonConnected=true;render();notify('Пример: прибор подключён и ответил.');return;}
    if(action==='nepton-snapshot'){notify('Пример: снимок результата сохранён отдельно.');return;}
    if(action==='nepton-measure'){notify('Пример измерения обновлён. Автоматическая запись в счётчик не выполнялась.');return;}
    if(action==='retry-document'){if(!canServer())return;render();return;}
    if(action==='confirm-clear-arshin'){state.arshinQuery='';state.arshinResults=false;state.arshinError=false;back();notify('История поиска очищена.');return;}
    if(action==='make-backup'){if(state.acts.every(aa=>aa.stage==='sent')){notify('На телефоне нет локальных актов для копии.');return;}navigate('backup-made');return;}
    if(action==='restore-run'){navigate('restore-result');return;}
    if(action==='confirm-receipt'){if(!canServer())return;a.receipt=true;back();notify('Пример: чек сформирован и добавлен к акту.');return;}
    if(action==='confirm-logout'){state.stack=[];state.view={name:'login'};render();saveState();return;}
    if(action==='resend-code'){if(canServer())notify('Пример: код отправлен повторно.');return;}
    if(['demo-call','demo-map','demo-office','demo-manager','demo-arshin','demo-update'].includes(action)){notify({'demo-call':'Пример перехода в приложение телефона.','demo-map':'Пример открытия адреса в картах.','demo-office':'Пример открытия личного кабинета.','demo-manager':'Пример звонка менеджеру.','demo-arshin':'Пример открытия записи Аршина.','demo-update':'Пример: установлена актуальная версия.'}[action]);return;}
    if(['refresh-tools','registry-update','refresh-quota'].includes(action)){if(canServer())notify('Пример: сведения обновлены.');return;}
    if(action==='batch'&&data.act)navigate('batch',{act:data.act});
    else navigate(action,{...(data.act?{act:data.act}:{}),...(data.meter?{meter:data.meter}:{})});
  }
  function submit(form){
    const data=Object.fromEntries(new FormData(form)), name=form.dataset.form, a=currentAct(),m=currentMeter(),b=currentBid();
    const fail=text=>{const error=form.querySelector('.pd-form-error');error.textContent=text;error.hidden=false;};
    captureForm();
    if(name==='appointment'){if(!['Новая','Назначена','Согласована'].includes(b.status)){fail('В этом статусе визит доступен только для просмотра.');return;}if(!canServer())return;Object.assign(b,{date:data.date,time:data.time,comment:data.comment});if(data.agreed)b.status='Согласована';back();notify('Пример: дата и время сохранены сервером.');}
    else if(name==='edit-bid'){if(!['Новая','Назначена','Согласована'].includes(b.status)){fail('Изменение заявки в этом статусе недоступно.');return;}if(!canServer())return;Object.assign(b,data);back();notify('Данные заявки обновлены.');}
    else if(name==='customer'){Object.assign(a,data);back();notify('Заказчик и адрес сохранены на телефоне.');}
    else if(name==='identity'){if(a.meters.filter(mm=>mm.id!==m.id&&mm.water===data.water).length>=3){fail('В одном акте допускается не более трёх счётчиков одного вида воды.');return;}Object.assign(m,data,{passport:!!data.passport});back();notify('Данные счётчика сохранены.');}
    else if(name==='measurements'){if([data.inspection,data.testing,data.software].includes('Не проверено')){fail('Завершите предварительные проверки. Они находятся в раскрываемой группе выше.');return;}if([data.inspection,data.testing,data.software].includes('Не соответствует')&&a.type==='Годен'){fail('Обнаружено несоответствие. Проверьте общее заключение в обзоре акта перед завершением.');return;}if(!data.value||!data.reading||(m.runs||[]).some(r=>!r.value)){fail('Заполните показание и погрешность каждого добавленного измерения.');return;}Object.assign(m,data,{measurement:true});back();notify('Измерения сохранены на телефоне.');}
    else if(name==='meter-tools'){m.tools=[data.nepton?'НЕПТОН-10':null,data.thermometer?'Термометр ТЛ-4':null,data.pressure?'Манометр МП3':null].filter(Boolean);back();notify('Средства поверки сохранены.');}
    else if(name==='payment'){Object.assign(a,{cost:data.cost,customerEmail:data.customerEmail});back();notify('Расчёт сохранён на телефоне.');}
    else if(name==='delete-act'){
      if(a.bid&&!canServer()){fail('Не удалось подтвердить статус связанной заявки. Акт не удалён.');return;}
      const linked=state.bids.find(bb=>bb.act===a.id);if(linked){linked.act=null;linked.status=data.bidStatus;}
      state.acts=state.acts.filter(aa=>aa.id!==a.id);tab('acts');notify('Пример: локальный акт удалён; выбранный статус заявки подтверждён.');
    }
    else if(name==='new-act'){createAct(data.number.trim());}
    else if(name==='add-meter'){
      if(a.meters.length>=6){fail('В акт уже добавлено 6 счётчиков.');return;}
      if(a.meters.filter(mm=>mm.water===data.water).length>=3){fail('В акте уже три счётчика этого вида воды.');return;}
      const id='m'+Date.now();a.meters.push({...data,id,diameter:'15',method:'МИ 1592-2015',passport:false,photo:false,measurement:false,tools:['НЕПТОН-10']});state.addMeterDraft=null;
      navigate('meter',{meter:id});notify('Счётчик добавлен. Можно заполнить фото и измерения.');
    }
    else if(name==='document'){if(!data.read){fail('Подтвердите, что прочитали документ.');return;}if(!canServer())return;if(state.view.doc==='quality')state.qualityRead=true;else state.documentRead=true;back();notify('Пример: ознакомление подтверждено сервером.');}
    else if(name==='storage'){
      if(+data.humidity<0||+data.humidity>100){fail('Влажность должна быть от 0 до 100 %.');return;}
      Object.assign(state.storage,data);if(!canServer()){fail('Запись сохранена на телефоне. Передача не подтверждена — повторите после подключения.');return;}state.storageSent=true;render();notify('Пример: условия хранения приняты сервером.');
    }
    else if(name==='maintenance'){if(!data.done){fail('Подтвердите выполнение обслуживания.');return;}if(!canServer())return;state.equipmentService=true;back();notify('Пример: сведения об обслуживании переданы.');}
    else if(name==='arshin'){state.arshinQuery=data.serial;state.arshinError=preferences.offline;state.arshinResults=!preferences.offline;render();saveState();}
    else if(name==='settings'){preferences.theme={'Как в системе':'system','Светлая':'light','Тёмная':'dark'}[data.theme];preferences.large=!!data.large;state.settings=data;back();notify('Настройки сохранены.');}
    else if(name==='personal'){state.personal=data;back();notify('Пример: данные профиля сохранены.');}
    else if(name==='support'){state.supportDraft=data.text;if(!canServer()){fail('Нет интернета. Текст сообщения сохранён как черновик.');return;}state.supportDraft='';back();notify('Пример: сообщение отправлено в поддержку.');}
    else if(name==='statistics'){if(!canServer())return;state.statisticsShown=true;state.statisticsPeriod=data;render();saveState();}
    else if(name==='nepton'){state.neptonStart=data.start;state.neptonEnd=data.end;state.neptonPhase=state.neptonPhase==='running'?'done':'running';render();saveState();}
    else if(name==='bid-filters'){state.bidScope=data.scope==='На сегодня'?'today':'all';state.bidStatus=data.status;state.bidFrom=data.from;state.bidTo=data.to;state.view={name:'bids'};state.stack=[];render();saveState();}
    else if(name==='history-filter'){state.actQuery=data.query;state.actFrom=data.from;state.actTo=data.to;state.view={name:'acts'};state.stack=[];render();saveState();}
    else if(name==='cancel-bid'){if(!canServer())return;b.status='Отменена';b.comment=`${data.reason}${data.comment?': '+data.comment:''}`;back();notify('Пример: отмена подтверждена. Доступность возврата проверяется сервером.');}
    else if(name==='change-number'){
      const number=data.number.trim();if(state.acts.some(aa=>aa!==a&&aa.id===number)){fail('Акт с таким номером уже существует.');return;}
      const old=a.id;a.id=number;state.bids.forEach(bb=>{if(bb.act===old)bb.act=number;});state.stack.forEach(v=>{if(v.act===old)v.act=number;});state.view.act=number;back();notify('Номер бланка изменён.');
    }
    else if(name==='batch'){
      const ids=new FormData(form).getAll('act');if(!ids.length){fail('Выберите хотя бы один готовый акт.');return;}
      if(!canServer()){fail('Отправка не выполнена. Все выбранные акты остаются на телефоне.');return;}
      if((preferences.unread&&!state.documentRead)||preferences.toolBlocked){navigate('admission');return;}
      state.batchResults=ids.map(id=>{const aa=state.acts.find(item=>item.id===id),sent=aa.stage!=='error';if(sent){aa.stage='sent';const linked=state.bids.find(bb=>bb.id===aa.bid);if(linked)linked.status='Выполнена';}return{id,sent};});
      navigate('batch-result');
    }
    else if(name==='login'){if(!canServer())return;state.loginEmail=data.email;navigate('login-code');}
    else if(name==='login-code'){if(data.code!=='123456'){fail('В примере используйте код 123456. Введённый код оставлен в поле.');return;}tab('bids');notify('Выполнен вход в учебный профиль.');}
  }
  content.addEventListener('click',event=>{
    const control=event.target.closest('button[data-do]');if(!control||control.disabled)return;event.preventDefault();perform(control.dataset.do,control);
  });
  content.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('input')){const form=event.target.closest('form[data-form]');if(form){event.preventDefault();if(form.reportValidity())submit(form);}}});
  content.addEventListener('submit',event=>{const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();submit(form);});
  content.addEventListener('input',event=>{
    if(event.target.dataset.search==='bids'){content.querySelector('[data-list=bids]').innerHTML=bidRows(event.target.value);if(globalThis.lucide)lucide.createIcons({attrs:{width:21,height:21}});return;}
    if(event.target.dataset.search==='registry'){content.querySelector('[data-list=registry]').innerHTML=registryRows(event.target.value);if(globalThis.lucide)lucide.createIcons({attrs:{width:21,height:21}});return;}
    if(event.target.closest('form')){captureForm();saveState();}
  });
  content.addEventListener('change',event=>{
    if(event.target.dataset.direct==='actType'){currentAct().type=event.target.value;render();saveState();}
  });
  restore(window.openai?.widgetState);
  render();
  window.addEventListener('openai:set_globals',event=>{const data=event.detail?.globals?.widgetState;if(data?.privateContent?.owner!==hostInstance&&restore(data))render();});
  if(globalThis.Tweak){
    const tweak=new Tweak({container:app,onChange:()=>{captureForm();render();saveState();}});
    tweak.addSelect(preferences,'theme',{label:'Оформление',options:[{label:'Как в системе',value:'system'},{label:'Светлая',value:'light'},{label:'Тёмная',value:'dark'}]});
    tweak.addToggle(preferences,'large',{label:'Крупный текст'});
    tweak.addToggle(preferences,'offline',{label:'Нет интернета'});
    tweak.addToggle(preferences,'unread',{label:'Новый документ СМК'});
    tweak.addToggle(preferences,'receipts',{label:'Право формировать чеки'});
    tweak.addToggle(preferences,'payer',{label:'Право пополнять квоту'});
    tweak.addToggle(preferences,'photoRecord',{label:'Фотофиксация по правилам организации'});
    tweak.addToggle(preferences,'toolBlocked',{label:'Ограничение по оборудованию'});
    tweak.addToggle(preferences,'support',{label:'Контакты поддержки организации'});
  }
})();
</script>
</div>
